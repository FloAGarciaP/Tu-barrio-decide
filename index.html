:root{

.macro{border:2px dashed var(--line);border-radius:12px;overflow:hidden;background:#fff}

.macro .opts{display:grid;gap:2px;padding:0 6px 8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.92rem;font-weight:500}
.opt:hover{background:var(--sunk)}
.opt input{margin-top:4px;accent-color:var(--accent);flex:none}
.mk{font-size:.68rem;font-weight:800;letter-spacing:.04em;border-radius:4px;padding:2px 6px;background:var(--quiero);color:#fff;white-space:nowrap}

/* zonas */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}

/* tarjetas */
.card{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}

.dots i.on{background:#fff}

.stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}

/* ============ CÁLCULOS ============ */
function calcProblemas(){
  const P=S.data.problemas, N=P.length;
  const cnt={};MACROS.forEach(m=>cnt[m.id]=0);P.forEach(p=>cnt[p.macro]=(cnt[p.macro]||0)+1);
  const peso={};MACROS.forEach(m=>peso[m.id]=N?cnt[m.id]/N*MACROS.length:0);
  const votos={};S.data.votos.forEach(v=>Object.entries(v.asignacion||{}).forEach(([pid,n])=>votos[pid]=(votos[pid]||0)+(+n||0)));
  const lista=P.map(p=>{
    const nz=(p.zonas||[]).length, tf=S.estado.transversalidad?1+TRANSV*Math.max(0,nz-1):1;
    const v=votos[p.id]||0;
    return {...p,votos:v,peso:peso[p.macro]||0,tf,puntaje:v*(peso[p.macro]||0)*tf}
  }).sort((a,b)=>b.puntaje-a.puntaje||b.votos-a.votos||(b.zonas||[]).length-(a.zonas||[]).length);
  const matriz={};MACROS.forEach(m=>{matriz[m.id]={};ZONAS.forEach(z=>matriz[m.id][z.id]=0)});
  P.forEach(p=>(p.zonas||[]).forEach(z=>{if(matriz[p.macro])matriz[p.macro][z]++}));
  return {N,cnt,peso,lista,matriz,votantes:S.data.votos.filter(v=>Object.values(v.asignacion||{}).some(n=>n>0)).length}
}
function preguntaPlantilla(p,zonas){
  const s=SUBS[p.sub];let h=s&&s.h;
  if(!h){h='abordar '+(p.otro||p.texto||'el problema detectado').replace(/[.\s]+$/,'').replace(/^./,c=>c.toLowerCase())}
  return `¿Cómo podríamos ${h}, detectado de forma crítica en ${zonasTexto(zonas)}, para asegurar la tranquilidad y movilidad sin detener la actividad del barrio?`
}
function calcRanking(){
  const evs=S.data.evaluaciones, des=S.estado.desafios||[];
  return S.data.soluciones.map(s=>{
    const notas=evs.filter(e=>+e.mesa!==+s.mesa).map(e=>(e.notas||{})[s.id]).filter(n=>n&&n.d&&n.f&&n.v);
    const k=notas.length, avg=f=>k?notas.reduce((a,n)=>a+n[f],0)/k:NaN;
    const d=avg('d'),f=avg('f'),v=avg('v');
    const dz=(des.find(x=>x.pid===s.desafio)||{}).zonas||[];
    const inter=(s.zonas||[]).filter(z=>dz.includes(z)).length;
    const pert=dz.length?0.75+0.25*inter/dz.length:1;
    const comp=INGR.filter(([k])=>s.ingredientes&&s.ingredientes[k]&&s.ingredientes[k].nombre).length;
    return {...s,k,d,f,v,pert,fa:f*pert,comp,puntaje:k?(d+f*pert+v)/3:NaN}
  }).sort((a,b)=>(Number.isFinite(b.puntaje)?b.puntaje:-1)-(Number.isFinite(a.puntaje)?a.puntaje:-1))
}

function baseURL(){return (S.estado.url||ARTIFACT_URL||'').replace(/#.*$/,'')}
function qrSVG(text){
  if(typeof qrcode!=='function'||!text)return '';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`
}

   ${D.length?D.map((d,i)=>`<article class="desafio"><span class="pos">${i+1}</span>
     <div class="row" style="gap:8px"><span class="mk">${d.macro} · ${esc((MAC[d.macro]||{}).c)}</span><span class="small muted">${esc(d.nombre)} · ${d.votos} votos · ${fmt(d.puntaje)} pts</span></div>
     ${admin?`<textarea id="q-${i}" rows="3" aria-label="Pregunta de desafío ${i+1}">${esc(d.pregunta)}</textarea>`:`<p class="q">${esc(d.pregunta)}</p>`}
     <div class="row" style="gap:8px">${zchips(d.zonas)}${admin?`<span style="flex:1"></span><button class="btn sm ghost" data-tpl="${i}">Volver a la plantilla</button>`:''}<span class="small muted" id="qs-${i}">${d.fuente==='editada'?'Editada por el equipo':'Plantilla automática · puedes editarla'}</span></div>
    </article>`).join(''):`<div class="empty">Los desafíos se fijan desde la pestaña Diagnóstico una vez cerrada la votación.</div>`}`;
  if(!admin)return;
  D.forEach((d,i)=>{
   const ta=$('#q-'+i);ta.onchange=()=>actualizarDesafio(i,{pregunta:ta.value.trim(),fuente:'editada'});
   body.querySelector(`[data-tpl="${i}"]`).onclick=()=>{const p=S.data.problemas.find(x=>x.id===d.pid)||d;actualizarDesafio(i,{pregunta:preguntaPlantilla(p,d.zonas),fuente:'plantilla'})};
  });
}
async function actualizarDesafio(i,patch){const D=(S.estado.desafios||[]).map((d,j)=>j===i?{...d,...patch}:d);await setEstado({desafios:D})}
function cardSolucion(s,o={}){
  const D=S.estado.desafios||[];const di=D.findIndex(d=>d.pid===s.desafio);
  return `<article class="card"><div class="hd"><span class="mesatag">Mesa ${esc(s.mesa)}</span>${di>=0?`<span class="mk" style="background:var(--e21)">Desafío ${di+1}</span>`:''}</div>
   <div class="sub">${esc(s.titulo)}</div><p class="txt">${esc(s.descripcion)}</p>
   <div class="stack" style="gap:5px">${INGR.map(([k,n])=>{const g=(s.ingredientes||{})[k]||{};return g.nombre?`<div class="small"><b>${n}:</b> ${esc(g.nombre)}${g.aplicacion?` <span class="muted">→ ${esc(g.aplicacion)}</span>`:''}</div>`:`<div class="small muted"><b>${n}:</b> sin ingrediente</div>`}).join('')}</div>
   <div class="ft">${zchips(s.zonas)}${s.tokens!=null&&s.tokens!==''?`<span class="small muted num">${esc(s.tokens)} tokens</span>`:''}${o.borrar?`<button class="btn sm ghost" style="margin-left:auto" data-del="${s.id}">Eliminar</button>`:''}</div>${o.after||''}</article>`
}
function pSols(body){
  const D=S.estado.desafios||[];const L=S.data.soluciones;
  body.innerHTML=`<div><span class="etapa">Etapa 2.1 · Mercado de soluciones</span><h1>Soluciones de las mesas</h1></div>
   ${L.length?(D.length?D:[{pid:null,pregunta:'Soluciones'}]).map((d,i)=>{const ls=L.filter(s=>d.pid==null||s.desafio===d.pid);return ls.length?`<section class="stack"><h3>${d.pid?`Desafío ${i+1}: `:''}<span class="muted" style="font-weight:600">${esc(d.pregunta)}</span></h3><div class="grid g3">${ls.map(s=>cardSolucion(s)).join('')}</div></section>`:''}).join(''):'<div class="empty">Las soluciones aparecerán aquí cuando los secretarios de mesa las ingresen.</div>'}`;
}
function pRank(body){
  const R=calcRanking().filter(s=>!filtroZona||(s.zonas||[]).includes(filtroZona));const evals=S.data.evaluaciones.filter(e=>Object.keys(e.notas||{}).length).length;
  body.innerHTML=`<div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="etapa">Etapa 2.2 · Evaluación multicriterio 3D</span><h1>Ranking oficial de soluciones</h1></div><span class="small muted">${evals} vecinos evaluaron</span></div>
   <div class="filters"><button data-z="" aria-pressed="${!filtroZona}">Todas las zonas</button>${ZONAS.map(z=>`<button data-z="${z.id}" aria-pressed="${filtroZona===z.id}"><i class="sw" style="background:var(--z-${z.id})"></i>${ZCODE[z.id]} ${z.n}</button>`).join('')}</div>
   <section class="panel" style="padding-block:8px">
    <div class="rk h"><span>#</span><span>Proyecto</span><span class="num opt-col">Deseab.</span><span class="num opt-col">Factib.*</span><span class="num opt-col">Viabil.</span><span class="num">Puntaje</span></div>
    ${R.length?R.map((s,i)=>`<div class="rk"><span class="pos">${Number.isFinite(s.puntaje)?i+1:'–'}</span><div style="min-width:0"><b>${esc(s.titulo)}</b><div class="small muted">Mesa ${esc(s.mesa)} · ${s.k} evaluaciones · ${s.comp}/4 ingredientes</div><div class="row" style="gap:4px;margin-top:4px">${zchips(s.zonas)}</div></div><span class="num opt-col">${fmt(s.d,1)}</span><span class="num opt-col" title="Factibilidad ${fmt(s.f,1)} × pertinencia territorial ${fmt(s.pert)}">${fmt(s.fa,1)}</span><span class="num opt-col">${fmt(s.v,1)}</span><span class="num score">${fmt(s.puntaje)}</span></div>`).join(''):'<div class="empty" style="margin:12px 0">No hay soluciones para esta zona todavía.</div>'}
   </section>
   <div class="formula">puntaje = (Deseabilidad + Factibilidad × pertinencia territorial + Viabilidad) ÷ 3
pertinencia territorial = 0,75 + 0,25 × (zonas de la solución que coinciden con las del desafío ÷ zonas del desafío)
* Factibilidad ajustada por pertinencia al uso de suelo del PRC. Escala de 1 a 5. No cuentan las notas a la propia mesa.</div>`;
  body.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{filtroZona=b.dataset.z||null;pRank(body)});
}

/* ---------- 2.1 SOLUCIONES ---------- */
VISTAS.soluciones={
 mount(el){
  el.innerHTML=`<div class="grid g2" style="align-items:start">
   <form class="panel stack" id="fs" novalidate>
    <div class="stack" style="gap:4px"><span class="etapa">Etapa 2.1 · Secretario de mesa</span><h2>Registro de soluciones</h2>
     <p class="small muted">Transcribe el lienzo: el desafío elegido, los ingredientes comprados con los 100 tokens y cómo se aplica en cada zona.</p></div>
    <div id="aviso"></div>
    <fieldset><legend>¿En qué mesa estás?</legend>${mesaRadios('s-mesa',LS.get('bd.mesa',null))}</fieldset>
    <fieldset><legend>Desafío que aborda</legend><div class="stack" id="s-des" style="gap:8px"></div></fieldset>
    <label class="f">Nombre del proyecto<input type="text" id="s-tit" maxlength="90" placeholder="Ej. Pit-Stop Manuel Montt"></label>
    <label class="f">Articulación de la solución<small>Cómo se conectan los ingredientes en un único proyecto.</small><textarea id="s-desc" maxlength="900"></textarea></label>
    <fieldset><legend>Ingredientes comprados <small>· al menos uno de cada categoría</small></legend>
     <div class="stack" style="gap:12px">${INGR.map(([k,n])=>`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px"><label class="f">${n}<input type="text" id="s-${k}-n" maxlength="80" placeholder="Ingrediente"></label><label class="f"><span class="muted" style="font-weight:500">Aplicación según zona</span><input type="text" id="s-${k}-a" maxlength="140" placeholder="Ej. En zona C, bahía en calzada"></label></div>`).join('')}</div></fieldset>
    <fieldset><legend>Zonas de uso de suelo donde se aplica</legend>
     <div class="zones">${ZONAS.map(z=>`<label class="zone"><input type="checkbox" name="s-z" value="${z.id}"><i class="sw" style="background:var(--z-${z.id})"></i><span><b>${ZCODE[z.id]}</b> ${z.n}</span></label>`).join('')}</div></fieldset>
    <label class="f">Tokens utilizados<small>De los 100 tokens de la mesa.</small><input type="number" id="s-tok" min="0" max="100" inputmode="numeric"></label>
    <p class="small" id="s-err" style="color:var(--e11);font-weight:700" hidden></p>
    <button class="btn primary big" type="submit">Crear tarjeta de solución</button>
   </form>
   <section class="stack"><h2 id="s-h">Soluciones de la mesa</h2><div class="stack" id="s-list"></div></section></div>`;
  el.querySelectorAll('input[name=s-mesa]').forEach(r=>r.onchange=()=>{LS.set('bd.mesa',+r.value);this.refresh()});
  $('#fs').onsubmit=async e=>{
   e.preventDefault();const err=$('#s-err');
   const mesa=mesaSel(el,'s-mesa');
   const desafio=(el.querySelector('input[name=s-d]:checked')||{}).value||'';const titulo=$('#s-tit').value.trim(),descripcion=$('#s-desc').value.trim();
   const zonas=[...el.querySelectorAll('input[name=s-z]:checked')].map(x=>x.value);
   const ingredientes={};INGR.forEach(([k])=>ingredientes[k]={nombre:$(`#s-${k}-n`).value.trim(),aplicacion:$(`#s-${k}-a`).value.trim()});
   const falta=[];if(!mesa)falta.push('mesa');if((S.estado.desafios||[]).length&&!desafio)falta.push('desafío');if(!titulo)falta.push('nombre');if(!descripcion)falta.push('articulación');if(!zonas.length)falta.push('al menos una zona');
   if(falta.length){err.textContent='Falta completar: '+falta.join(', ')+'.';err.hidden=false;return}
   const faltanI=INGR.filter(([k])=>!ingredientes[k].nombre).map(([,n])=>n);
   err.hidden=true;
   const ok=await guardar(()=>put('soluciones','s-'+rid(),{mesa,desafio,titulo,descripcion,ingredientes,zonas,tokens:$('#s-tok').value,ts:Date.now()}),faltanI.length?'Tarjeta creada. Falta ingrediente: '+faltanI.join(', '):'Tarjeta de solución creada');
   if(ok){['s-tit','s-desc','s-tok',...INGR.flatMap(([k])=>[`s-${k}-n`,`s-${k}-a`])].forEach(i=>$('#'+i).value='');el.querySelectorAll('input[name=s-z],input[name=s-d]').forEach(x=>x.checked=false)}
  };
 },
 refresh(){
  $('#aviso').innerHTML=hayJornada()?avisoAcceso():sinJornada();
  const D=S.estado.desafios||[];const wrap=$('#s-des');const sel=(wrap.querySelector('input:checked')||{}).value;
  const sig=D.map(d=>d.pid+d.pregunta).join('|');
  if(wrap.dataset.sig!==sig){wrap.dataset.sig=sig;
   wrap.innerHTML=D.length?D.map((d,i)=>`<label class="opt" style="border:2px dashed var(--line);background:#fff"><input type="radio" name="s-d" value="${d.pid}" ${sel===d.pid?'checked':''} data-i="${i}"><span><b>Desafío ${i+1}</b> · <span class="small">${esc(d.pregunta)}</span></span></label>`).join(''):'<p class="small muted">Aún no hay desafíos fijados. Puedes ingresar la solución igual.</p>';
   wrap.querySelectorAll('input').forEach(r=>r.onchange=()=>{const d=D[+r.dataset.i];document.querySelectorAll('input[name=s-z]').forEach(c=>c.checked=d.zonas.includes(c.value))});
  }
  const mesa=mesaSel(document,'s-mesa');const L=S.data.soluciones.filter(s=>+s.mesa===mesa);
  $('#s-h').textContent=mesa?'Soluciones de la mesa '+mesa:'Soluciones de la mesa';
  $('#s-list').innerHTML=!mesa?'<div class="empty">Elige tu mesa para ver aquí su tarjeta.</div>':L.length?L.map(s=>cardSolucion(s,{borrar:true})).join(''):'<div class="empty">La tarjeta de solución de esta mesa aparecerá aquí al crearla.</div>';
  $('#s-list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>guardar(()=>del('soluciones',b.dataset.del),'Solución eliminada'));
 }
};

/* ---------- 2.2 EVALUAR ---------- */
let borradorEval=null;
const guardarEval=debounce(async()=>{if(!borradorEval)return;await guardar(()=>put('evaluaciones',voterId(),{...borradorEval,ts:Date.now()}))},700);
VISTAS.evaluar={
 mount(el){
  el.innerHTML=`<div class="narrow stack"><div class="stack" style="gap:6px"><span class="etapa">Etapa 2.2 · Evaluación multicriterio 3D</span><h1>Evalúa los proyectos de las otras mesas</h1>
   <p class="muted" style="font-weight:500">Califica de 1 a 5 cada dimensión. Se guarda sola.</p></div><div id="aviso"></div>
   <details class="panel small"><summary style="cursor:pointer;font-weight:700">Qué significa cada dimensión</summary><div class="stack" style="gap:6px;margin-top:10px"><p><b>Deseabilidad:</b> ¿resuelve con precisión el conflicto en las zonas de uso de suelo señaladas?</p><p><b>Factibilidad:</b> ¿es realizable por el municipio respetando el Plan Regulador Comunal?</p><p><b>Viabilidad:</b> ¿es sostenible con la colaboración entre vecinos, locales comerciales y municipalidad?</p></div></details>
   <div id="e-body" class="stack"></div></div>`;
 },
 refresh(){
  const body=$('#e-body');
  if(!hayJornada()){$('#aviso').innerHTML='';body.innerHTML=sinJornada();borradorEval=null;return}
  $('#aviso').innerHTML=avisoAcceso();
  if(S.estado.fase!=='evaluacion'){body.innerHTML=`<div class="empty"><h3>La evaluación no está abierta</h3><p>Se abrirá después de que los voceros presenten sus proyectos. Esta pantalla se actualiza sola.</p></div>${botonSiguiente()}`;bindSig();return}
  const id=voterId();
  if(!borradorEval){const mio=S.data.evaluaciones.find(e=>e.id===id);borradorEval=mio?{mesa:mio.mesa,notas:JSON.parse(JSON.stringify(mio.notas||{}))}:{mesa:null,notas:{}}}
  const otras=S.data.soluciones.filter(s=>borradorEval.mesa==null||+s.mesa!==+borradorEval.mesa);
  const hechas=otras.filter(s=>{const n=borradorEval.notas[s.id];return n&&n.d&&n.f&&n.v}).length;
  let html=`<fieldset><legend>¿En qué mesa trabajaste? <small>· no evaluarás el proyecto de tu propia mesa</small></legend>${mesaRadios('e-mesa',borradorEval.mesa)}</fieldset>`;
  if(borradorEval.mesa!=null){
   html+=`<p class="small" style="font-weight:700">${hechas} de ${otras.length} proyectos evaluados</p>`;
   html+=otras.length?otras.map(s=>{const n=borradorEval.notas[s.id]||{};return cardSolucion(s,{after:`<div class="stack" style="gap:8px;border-top:2px dashed var(--line);padding-top:12px">${[['d','Deseabilidad'],['f','Factibilidad'],['v','Viabilidad']].map(([k,t])=>`<div class="scale" role="group" aria-label="${t}"><span class="l">${t}</span>${[1,2,3,4,5].map(x=>`<button type="button" data-s="${s.id}" data-k="${k}" data-x="${x}" aria-pressed="${n[k]===x}">${x}</button>`).join('')}</div>`).join('')}</div>`})}).join(''):'<div class="empty">Aún no hay proyectos de otras mesas.</div>';
  }
  html+=botonSiguiente();
  body.innerHTML=html;
  body.querySelectorAll('input[name=e-mesa]').forEach(r=>r.onchange=()=>{borradorEval.mesa=+r.value;guardarEval();VISTAS.evaluar.refresh()});
  body.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const n=borradorEval.notas[b.dataset.s]||(borradorEval.notas[b.dataset.s]={});n[b.dataset.k]=+b.dataset.x;guardarEval();VISTAS.evaluar.refresh()});
  bindSig();
 }
};

/* ============ ARRANQUE ============ */
window.addEventListener('hashchange',mount);
mount();
(function init(){
  S.esAdmin=!!LS.get('bd.fac',false);
  const cfg=FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId;
  if(!cfg||!window.firebase){S.modo='local';loadLocal();refresh();
    if(cfg&&!window.firebase){S.modo='error';refresh()}
    return}
  let db;
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){console.warn(e);S.modo='error';refresh();return}
  S.db=db;S.modo='compartido';let ok=false;
  const tm=setTimeout(()=>{if(!ok)toast('Sin respuesta del servidor todavía; revisa la conexión')},10000);
  db.doc('control/estado').onSnapshot(snap=>{
   if(!snap.metadata.fromCache){ok=true;clearTimeout(tm)}
   const prev=S.estado.tid;S.estado=snap.exists?{...S.estado,...snap.data()}:{...S.estado,tid:''};
   if(prev!==S.estado.tid||S.subs.length===0)subscribeTaller();
   if(prev!==S.estado.tid){borradorVoto=null;borradorEval=null}
   refresh();
  },e=>{console.warn(e);S.modo='error';refresh()});
  db.collection('control/estado/sesiones').onSnapshot(snap=>{S.sesiones=snap.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.warn(e));
  refresh();
})();
</script>

</body>
