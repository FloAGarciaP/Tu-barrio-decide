<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Barrio Decide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&family=Goblin+One&family=Hachi+Maru+Pop&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: claves gráficas del Figma "Metodologías": Gabarito, tarjetas de color con franja blanca
   y etiqueta gris, bordes punteados. Etapa 1 = azul/magenta/morado/turquesa; Etapa 2 = ocre/verde/rojo/menta. Barra de recorrido fija arriba: dónde estoy y cuánto tiempo queda.
   Tema claro único, deliberado para calzar con el material impreso. */
:root{
  color-scheme:light;
  --bg:#F7F0E1; --surface:#FFFCF5; --sunk:#EFE5D2; --ink:#1D1A17; --muted:#6A6157; --line:#CDBFA8;
  --e0:#03BBAD; --e0t:#CDEFEB; --e11:#4DA4DD; --e11t:#D6EAF7; --e12:#D0387C; --e12t:#F5D2E2; --e13:#8A54B3; --e13t:#E5D8EF;
  --e21:#CAA057; --e21t:#F2E5CC; --e22:#2FA93F; --e22t:#CDEBD1; --e3:#E5414C; --e3t:#FAD3D6;
  --d1:#D0387C; --d2:#8A54B3; --d3:#4DA4DD;
  --soy:#4DA4DD; --quiero:#D0387C; --justo:#8A54B3; --obst:#03BBAD;
  --uso:#03BBAD; --tra:#0E74B5; --dash:#0E74B5; --label:#676767;
  --m-fis:#CAA057; --m-nor:#2FA93F; --m-com:#E5414C; --m-vec:#01DB9D;
  --chip:#3D3D3D; --chip-off:#BBB4AF; --on-accent:#FFFFFF; --ok:#2FA93F; --warn:#B4852F; --bad:#E5414C; --warnt:#FAD3D6;
  --accent:var(--e0); --accent-t:var(--e0t);
  --z-R:#FFEE00; --z-C:#C623CF; --z-V:#2918B5; --z-P:#12BA26;
  --f:"Gabarito","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
body[data-e="0"]{--accent:var(--e0);--accent-t:var(--e0t)}
body[data-e="11"]{--accent:var(--e11);--accent-t:var(--e11t)}
body[data-e="12"]{--accent:var(--e12);--accent-t:var(--e12t)}
body[data-e="13"]{--accent:var(--e13);--accent-t:var(--e13t)}
body[data-e="21"]{--accent:var(--e21);--accent-t:var(--e21t)}
body[data-e="22"]{--accent:var(--e22);--accent-t:var(--e22t)}
body[data-e="3"]{--accent:var(--e3);--accent-t:var(--e3t)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{--accent-ink:color-mix(in srgb,var(--accent) 66%,#1D1A17);background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.2vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.28rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
ul,ol{margin:0;padding-left:1.2em}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:600px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.lead{font-style:italic;font-weight:500;font-size:1.1rem;max-width:56ch}
.etapa{font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header + recorrido */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px dashed var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 22px;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;flex-direction:column;gap:8px}
.top .l1{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.brand{text-decoration:none;white-space:nowrap}
.logo{display:inline-flex;flex-direction:column;font-weight:800;line-height:.86;letter-spacing:-.01em;font-size:1.05rem}
.logo b{font-weight:800;color:#3D3D3D}
.logo b+b{color:#fff;-webkit-text-stroke:.09em #3D3D3D;paint-order:stroke fill;font-size:1.32em}
.logo.big{font-size:clamp(2.4rem,7vw,4.4rem)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end}
.vecina{width:clamp(120px,22vw,220px);height:auto;display:block}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero .vecina{display:none}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 300px;min-width:0;scrollbar-width:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.84rem;font-weight:600}
nav.tabs a .n{font-size:.7rem;font-weight:800;margin-right:4px}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--chip);color:#fff;white-space:nowrap}
.chip.off{background:var(--chip-off)}
.chip i{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block}
.chip.live i{background:#7BE08E} .chip.local i{background:#F2C14E}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
.seg{position:relative;border-radius:6px;padding:4px 6px 5px;background:var(--sunk);color:var(--muted);font-size:.68rem;font-weight:700;line-height:1.2;min-width:0;overflow:hidden}
.seg b{display:block;font-size:.66rem;font-weight:800;letter-spacing:.04em}
.seg span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done{background:color-mix(in srgb,var(--sc) 22%,var(--sunk));color:var(--ink)}
.seg.now{background:var(--sc);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--sc)}
.seg .fill{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85)}
.trackinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.over{color:var(--bad)}
@media (max-width:700px){.seg span{display:none}.seg{padding:4px 4px 6px;text-align:center}header.top{position:static}.preview{padding:10px 12px;font-size:.86rem}}

/* superficies */
.panel{background:var(--surface);border:2px dashed var(--accent);border-radius:var(--r);padding:20px}
.panel.plain{border-color:var(--line)}
.panel.fill{background:var(--accent-t);border-style:solid}
.notice{border-radius:10px;padding:12px 14px;background:var(--warnt);font-size:.9rem;font-weight:500}
.notice.info{background:var(--e0t)}
.notice.good{background:var(--e21t)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
details.guia{border:2px dashed var(--line);border-radius:12px;background:var(--surface)}
details.guia summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.guia summary::-webkit-details-marker{display:none}
details.guia summary::after{content:"+";font-weight:800;color:var(--accent)}
details.guia[open] summary::after{content:"–"}
.guiabody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.guiabody h4{margin:0;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clave{border-left:4px solid var(--accent);background:var(--accent-t);padding:8px 12px;border-radius:0 8px 8px 0;font-weight:600}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.93rem}
label.f small{font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=date],input[type=password],textarea,select{font:inherit;font-weight:500;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:800;font-size:.95rem;margin-bottom:8px;padding:0;display:flex;gap:8px;align-items:center}
legend small{font-weight:500;color:var(--muted);font-size:.8rem}
.btn{font:inherit;font-weight:800;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border:2px dashed var(--line)}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:14px 20px;font-size:1.05rem;width:100%}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mesa{position:relative;cursor:pointer}
.mesa input{position:absolute;opacity:0;inset:0}
.mesa span{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:8px 4px;font-weight:700;font-size:.78rem;background:#fff}
.mesa span b{font-size:1.5rem;font-weight:800;line-height:1}
.mesa input:checked+span{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.mesa input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* selector de tarjetas */
.cardtag{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;font-size:.7rem;font-weight:800;border-radius:4px;padding:2px 6px;color:#fff;background:var(--cc,var(--chip))}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.pick{position:relative;cursor:pointer;display:block}
.pick input{position:absolute;opacity:0;inset:0}
.pick span{display:flex;flex-direction:column;height:100%;border-radius:8px;background:var(--cc);padding:5px;gap:5px;transition:transform .12s}
.pick span .cardtag{align-self:flex-start;background:transparent;color:#fff;font-size:.8rem;padding:2px 3px;min-width:0}
.pick span em{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-style:normal;background:#fff;border-radius:3px;padding:7px 6px;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--label);outline:1px dashed color-mix(in srgb,var(--cc) 70%,#000);outline-offset:-3px}
.pick:hover span{transform:translateY(-1px)}
.pick input:checked+span{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.pick input:checked+span em{background:var(--ink);color:#fff;outline-color:transparent}
.pick input:focus-visible+span{outline:3px solid var(--ink);outline-offset:3px}
.cardblock{border:1.5px dashed var(--cc);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cardblock .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cardblock .hd b{font-weight:800;color:#fff;background:var(--cc);border-radius:6px;padding:3px 10px;font-size:1rem}
.cardblock .hd small{color:var(--muted);font-weight:500}
.subcat{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:color-mix(in srgb,var(--cc) 70%,#1D1A17);margin-top:4px}
.preview{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:3;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:500;display:flex;flex-direction:column;gap:8px}
.preview b{color:#fff}
.preview .row{justify-content:space-between}

/* zonas */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.zone{display:flex;flex-direction:column;gap:2px;border:2px dashed var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.84rem;font-weight:500;background:#fff;position:relative}
.zone input{position:absolute;opacity:0;inset:0}
.zone b{display:flex;gap:6px;align-items:center;font-size:.92rem}
.zone:has(input:checked){border-style:solid;border-color:var(--zc);background:color-mix(in srgb,var(--zc) 16%,#fff)}
.zone:has(input:focus-visible){outline:3px solid var(--zc);outline-offset:2px}
@media (max-width:480px){.zones{grid-template-columns:1fr}}
.sw{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.zchip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.zchip .sw{width:9px;height:9px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.legend .it{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#fff;border:2px solid var(--zc)}
.legend .it .sw{width:22px;height:22px;margin-top:2px}

/* tarjetas de contenido */
.card{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .sub{font-weight:800;font-size:1rem;line-height:1.25}
.card .txt{font-size:.9rem;font-weight:500;overflow-wrap:anywhere}
.card .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.card.mine{border-style:solid;border-color:var(--accent);background:#fff}
.mesatag{font-size:.72rem;font-weight:700;color:var(--muted)}
.relato{font-size:.9rem;font-weight:500;line-height:1.4}
.relato .k{font-weight:800}
.relato .k.s{color:var(--soy)} .relato .k.q{color:var(--quiero)} .relato .k.j{color:var(--justo)} .relato .k.o{color:var(--obst)}
.catchip{font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;color:#fff;white-space:nowrap}
.catchip.U{background:var(--uso)} .catchip.T{background:var(--tra)}

/* votos */
.votebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}
.dots i.on{background:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .n{font-size:1.25rem;font-weight:800;min-width:1.6em;text-align:center}

/* votación en vivo */
.live{position:relative}
.lrow{position:absolute;left:0;right:0;height:58px;display:grid;grid-template-columns:2.4em minmax(0,1fr) 8em;gap:10px;align-items:center;transition:top .6s cubic-bezier(.2,.8,.2,1)}
.lrow .pos{font-size:1.5rem;font-weight:800;color:var(--muted);text-align:center}
.lrow.top3 .pos{color:var(--accent-ink)}
.lrow .nm{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.lrow .bar{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.lrow .bar b{display:block;height:100%;background:var(--muted);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lrow.top3 .bar b{background:var(--accent)}
.lrow .sc{text-align:right;font-variant-numeric:tabular-nums}
.lrow .sc b{font-size:1.3rem;font-weight:800;display:block;line-height:1}
.lrow .sc span{font-size:.72rem;color:var(--muted);font-weight:700;white-space:nowrap}

/* podio y ponderación */
.podio{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}
@media (max-width:760px){.podio{grid-template-columns:1fr}}
.pcard{border-radius:10px;padding:14px 16px;background:var(--dc);color:#fff;display:flex;flex-direction:column;gap:6px;min-width:0;border:1.5px dashed rgba(0,0,0,.35);transition:transform .3s}
.pcard .badge{align-self:flex-start;background:#fff;color:#1E1E1E;font-weight:800;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pcard h3{color:#fff;font-size:1.12rem;line-height:1.2}
.pcard:first-child h3{font-size:1.45rem}
.pcard .big{font-size:2.3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.pcard .calc{font-size:.84rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:3px 8px;align-self:flex-start}
.pcard.vacio{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.pcard.vacio h3{color:var(--muted)}
.pcard.flash{transform:scale(1.03)}
.pesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.peso{border-radius:10px;border:1.5px dashed var(--pc);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.peso .x{font-size:2rem;font-weight:900;color:var(--pc);line-height:1}
.peso .trk{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.peso .trk b{display:block;height:100%;background:var(--pc);border-radius:99px;transition:width .6s}
.lrow .tag{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;color:#fff;background:var(--dc,#1E1E1E);flex:none}
.lrow.elegido{background:color-mix(in srgb,var(--dc) 12%,transparent);border-radius:8px}
.lrow.elegido .bar b{background:var(--dc)!important}
.lrow.flash .sc b{animation:flash .9s}
@keyframes flash{0%{color:var(--e12);transform:scale(1.35)}100%{transform:none}}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .it{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.86rem;font-weight:700}
.mini .it .trk{grid-column:2/4;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.mini .it .trk b{display:block;height:100%;background:var(--e12);border-radius:99px}
.wchip{display:inline-flex;gap:6px;align-items:center;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;background:var(--wc)}

/* ficha municipal de proyecto (Figma: Instrucciones) */
.ficha{background:#F1F0EC;border:1.5px solid #8A8784;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.fh{background:#E6E4DF;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fh h2{font-size:1.2rem;letter-spacing:.01em;color:#333}
.fh .sub{font-size:.8rem;color:#555;font-weight:500}
.fh .campos{display:grid;grid-template-columns:minmax(0,2fr) auto minmax(0,1.5fr);gap:8px 12px;align-items:end}
.fh .campos label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:#555}
.fh .campos input{padding:7px 10px}
.fh .mesaN{font-size:1.4rem;font-weight:900;color:#333;padding:2px 10px;border-bottom:1.5px solid #8A8784}
.fgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(0,.9fr);gap:12px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.fgrid,.fgrid2{grid-template-columns:1fr}.fh .campos{grid-template-columns:1fr}}
.fb{background:#fff;border:1.2px solid #8A8784;border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fb h4{margin:0;font-size:.92rem;font-weight:800;color:#333;letter-spacing:.02em}
.fb .ay{font-size:.76rem;color:#555;font-weight:500;margin-top:-4px}
.fb .q{font-size:.82rem;font-weight:800;color:#333}
.fb textarea{min-height:64px;font-size:.88rem}
.slot{border:1.2px solid var(--mc);border-left:6px solid var(--mc);border-radius:6px;background:color-mix(in srgb,var(--mc) 9%,#fff);padding:8px 10px;display:flex;flex-direction:column;gap:5px;text-align:left;font:inherit;cursor:pointer;color:var(--ink)}
.slot b{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#333}
.slot .ph{font-size:.78rem;color:#777}
.slot .it{display:flex;justify-content:space-between;gap:6px;font-size:.8rem;font-weight:700}
.slot .it span:last-child{color:color-mix(in srgb,var(--mc) 70%,#1E1E1E);flex:none}
.slot:focus-visible{outline:3px solid var(--mc);outline-offset:2px}
.plato{align-self:center;width:min(100%,300px);aspect-ratio:1;border-radius:50%;border:3px solid #9C9893;background:#F7F6F3;display:flex;align-items:center;justify-content:center;padding:22px;box-shadow:inset 0 0 0 12px #fff,inset 0 0 0 14px #CFCBC5}
.plato textarea{border:0;background:transparent;text-align:center;font-weight:700;font-size:.95rem;resize:none;height:100%;min-height:0;color:#333}
.plato textarea::placeholder{color:#888;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.plato textarea:focus{outline:2px dashed #9C9893;border-radius:50%}
.foto{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:700}
.foto img{max-width:100%;border-radius:6px;border:1px solid var(--line)}
.saldo{display:flex;gap:16px;flex-wrap:wrap;font-size:.95rem;font-weight:700;color:#333}
.saldo b{font-size:1.3rem;font-weight:900}
details.menuopen>summary{list-style:none}
details.menuopen>summary::-webkit-details-marker{display:none}
.fres{display:grid;gap:8px}
.fres .bloq{background:#F6F5F2;border-radius:6px;padding:8px 10px;font-size:.84rem}
.fres .bloq b{display:block;font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#555;margin-bottom:2px}
.fres .platoTxt{font-size:1rem;font-weight:700;line-height:1.35}

/* buzón */
.buzhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.buzhead svg{width:64px;height:64px}
.probs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:8px}
.ejemplo{border-radius:10px;background:var(--surface);border:1.5px dashed var(--trazo,#0E74B5);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ejemplo .k{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--e13)}
.ejemplo p{font-weight:600;line-height:1.35}
.sino{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.sino div{border-radius:10px;padding:10px 12px;font-size:.86rem;font-weight:500;line-height:1.35}
.sino .no{background:#FBE1E3}
.sino .si{background:#D7F0DB}
.sino b{display:block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.builder{display:grid;gap:10px}
.builder .lineas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.carta{border-radius:10px;background:var(--e13);color:#fff;padding:16px 18px;font-size:clamp(1.05rem,2vw,1.3rem);font-weight:700;line-height:1.35;border:1.5px dashed rgba(0,0,0,.35)}
.sobre{border-radius:10px;background:var(--surface);border:1.5px dashed var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.sobre p{font-weight:600}

/* escala */
.crit{display:flex;flex-direction:column;gap:4px}
.crit .l{font-size:.84rem;font-weight:800}
.crit .l small{font-weight:500;color:var(--muted)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{font:inherit;font-weight:800;height:42px;border-radius:8px;border:2px dashed var(--line);background:#fff;color:var(--ink);cursor:pointer;font-size:1rem}
.scale button[aria-pressed="true"]{background:var(--accent);border:2px solid var(--accent);color:#fff}

/* mercado */
.menu{display:flex;flex-direction:column;gap:14px}
.mcat{border-radius:12px;background:var(--surface);border:1.5px dashed var(--mc);overflow:hidden}
.mcat .mh{padding:10px 14px;background:var(--mc);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.mcat .mh b{font-weight:800;color:#fff;font-size:1.05rem}
.mcat .mh small{font-weight:700;color:#fff;opacity:.95}
.mcat .mq{padding:8px 14px 0;font-size:.82rem;font-style:italic;color:var(--muted)}
.ingr{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px;padding:12px 14px 14px}
.ing{position:relative;display:flex;flex-direction:column;text-align:left;font:inherit;border:0;border-radius:6px;background:var(--mc);padding:6px;cursor:pointer;color:var(--ink);gap:6px;transition:transform .12s}
.ing:hover{transform:translateY(-1px)}
.ing .top{display:flex;justify-content:space-between;align-items:flex-start;min-height:56px;padding:4px 6px;border:1px dashed rgba(0,0,0,.55);border-bottom:0;border-radius:3px 3px 0 0}
.ing .top i{font-style:normal;font-size:.72rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:5px}
.ing .top i::before{content:"";width:9px;height:9px;border-radius:50%;border:1px dashed rgba(0,0,0,.7)}
.ing .top b{font-size:1.5rem;font-weight:800;color:#fff;line-height:1;font-variant-numeric:tabular-nums}
.ing .nm{background:#fff;border-radius:3px;padding:7px 6px;font-weight:700;font-size:.82rem;color:var(--label);text-align:center;line-height:1.2}
.ing .d{font-size:.72rem;color:color-mix(in srgb,var(--mc) 25%,#1D1A17);font-weight:600;line-height:1.25;padding:0 2px 2px}
.ing[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.ing[aria-pressed="true"] .nm{background:var(--ink);color:#fff}
.ing[aria-pressed="true"]::after{content:"✓ Comprado";position:absolute;top:-10px;right:8px;background:var(--ink);color:#fff;font-size:.68rem;font-weight:800;border-radius:999px;padding:2px 8px}
.ing:disabled{opacity:.4;cursor:not-allowed}
.libre{padding:0 14px 14px}
.libre label{font-size:.84rem}
.bank{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:3;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.bank .row{justify-content:space-between}
.coins{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.coins i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.18);display:block}
.coins i.on{background:#E2B020}
.coins i.over{background:#FF7C66}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks span{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.14)}
.checks span.ok{background:#2B8A38}
.meter{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter b{display:block;height:100%;background:#E2B020;border-radius:99px;transition:width .4s}
.meter b.over{background:var(--bad)}
.compra{display:inline-flex;gap:5px;align-items:center;font-size:.74rem;font-weight:700;border-radius:4px;padding:2px 8px;background:color-mix(in srgb,var(--mc) 22%,#fff);border-left:4px solid var(--mc)}

/* mapa de calor */
.tbl{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:4px;width:100%;min-width:440px}
table.heat th{font-size:.76rem;font-weight:700;text-align:left;padding:4px 6px;vertical-align:bottom}
table.heat th.zh{text-align:center}
table.heat td{text-align:center;font-weight:800;font-size:1rem;padding:9px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
table.heat td.tot{background:transparent;color:var(--muted);font-size:.85rem}
.bars{display:flex;flex-direction:column;gap:10px}
.barx{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.88rem;font-weight:500}
.barx .trk{grid-column:1/-1;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.barx .trk b{display:block;height:100%;border-radius:99px}
.heatgrid{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:900px){.heatgrid{grid-template-columns:1fr}}

/* desafíos y ranking */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:2px dashed var(--accent);border-radius:12px;padding:10px 14px;background:var(--surface)}
.kpi b{font-size:2.1rem;font-weight:800;display:block;line-height:1.1;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;font-weight:600;color:var(--muted)}
.desafio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 20px;padding:20px;border-radius:var(--r);background:var(--surface);border:2px dashed var(--line)}
.desafio .pos{font-size:4.2rem;font-weight:800;line-height:.9;grid-row:span 4;color:var(--dc)}
.desafio .q{font-size:clamp(1.05rem,2.1vw,1.4rem);font-weight:700;line-height:1.3}
.desafio textarea{font-size:1.02rem;font-weight:600}
.dc1{--dc:var(--d1)} .dc2{--dc:var(--d2)} .dc3{--dc:var(--d3)}
.formula{font-size:.82rem;font-weight:500;background:var(--sunk);border-radius:10px;padding:10px 12px;overflow-x:auto;white-space:pre-wrap}
.formula b{font-weight:800}
.reto{border-radius:var(--r);padding:16px 18px;background:var(--accent-t);display:flex;flex-direction:column;gap:6px}
.reto .q{font-size:clamp(1.05rem,2vw,1.3rem);font-weight:700;line-height:1.3}
.rk{display:grid;grid-template-columns:2.5em minmax(0,1fr) repeat(5,4em);gap:8px 10px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.rk:last-child{border-bottom:0}
.rk.h{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:800;padding-top:4px}
.rk .pos{font-size:1.8rem;font-weight:800;color:var(--accent-ink)}
.rk .num{text-align:right}
.rk .score{font-weight:800;color:var(--accent-ink);font-size:1.15rem}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font:inherit;font-size:.82rem;font-weight:600;border:2px dashed var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button[aria-pressed="true"]{border:2px solid var(--ink);background:var(--ink);color:#fff}
.subtabs{display:flex;gap:4px;border-bottom:2px dashed var(--line);overflow-x:auto}
.subtabs button{font:inherit;font-weight:700;background:none;border:0;border-bottom:4px solid transparent;padding:10px 12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.subtabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

/* inicio */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.step{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;border:2.5px solid var(--sc);background:var(--st)}
.step .etapa{color:var(--sc)}
[data-sc="0"]{--sc:var(--e0);--st:var(--e0t)} [data-sc="11"]{--sc:var(--e11);--st:var(--e11t)} [data-sc="12"]{--sc:var(--e12);--st:var(--e12t)}
[data-sc="13"]{--sc:var(--e13);--st:var(--e13t)} [data-sc="21"]{--sc:var(--e21);--st:var(--e21t)} [data-sc="22"]{--sc:var(--e22);--st:var(--e22t)} [data-sc="3"]{--sc:var(--e3);--st:var(--e3t)} [data-sc="p"]{--sc:var(--chip);--st:var(--sunk)}
.qr{background:#fff;border-radius:8px;padding:8px;width:130px;max-width:100%;aspect-ratio:1;align-self:flex-start}
.qr svg{display:block;width:100%;height:100%}
.urltxt{font-size:.7rem;font-weight:600;word-break:break-all;color:var(--ink);background:rgba(255,255,255,.6);border-radius:6px;padding:4px 6px}
.ruta{display:flex;flex-direction:column;gap:0}
.ruta .it{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:2px dashed var(--line)}
.ruta .it:first-child{border-top:0}
.ruta .dot{width:28px;height:28px;border-radius:50%;background:var(--st);border:2.5px solid var(--sc);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:800;color:var(--sc)}
.ruta .it.done .dot{background:var(--sc);color:#fff}
.ruta .it.now .dot{background:var(--sc);color:#fff;box-shadow:0 0 0 4px var(--st)}
.ruta .it.now{font-weight:700}
.phases{display:flex;gap:6px;flex-wrap:wrap}
.phases button{font:inherit;font-size:.84rem;font-weight:600;border:2px dashed var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:7px 11px;cursor:pointer;text-align:left}
.phases button .n{font-size:.68rem;font-weight:800;display:block;color:var(--muted)}
.phases button[aria-pressed="true"]{border:2px solid var(--sc);background:var(--sc);color:#fff}
.phases button[aria-pressed="true"] .n{color:#fff}
.hist .it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:2px dashed var(--line);flex-wrap:wrap}
.durs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.radios{display:flex;flex-direction:column;gap:6px}
.radios label{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:.9rem;cursor:pointer}
.radios input{margin-top:4px;accent-color:var(--e0)}

/* overlay de cierre de etapa */
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--ink) 55%,transparent)}
.overlay .box{background:var(--surface);border-radius:20px;padding:28px 26px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:12px;text-align:center;border:3px solid var(--oc);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.overlay .chk{width:64px;height:64px;border-radius:50%;background:var(--oc);margin:0 auto;display:flex;align-items:center;justify-content:center}
.overlay .next{border-top:2px dashed var(--line);padding-top:12px;font-weight:700}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}

/* cierre */
.camino{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;align-items:start;position:relative;padding-top:6px}
.camino::before{content:"";position:absolute;left:7%;right:7%;top:26px;height:4px;background:var(--e3);border-radius:2px}
.camino .cs{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;z-index:1;font-size:.74rem;font-weight:700}
.camino .cs i{width:42px;height:42px;border-radius:50%;background:var(--sc);display:flex;align-items:center;justify-content:center;border:4px solid var(--bg)}
.camino .cs span{color:var(--muted);font-weight:600}
.winner{border-radius:var(--r);padding:20px;background:var(--e3t);border:3px solid var(--e3);display:flex;flex-direction:column;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;font-size:.9rem;max-width:calc(100% - 32px)}
.ex{font-size:.6rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--warn);color:var(--warn);border-radius:4px;padding:0 4px}
@media (max-width:640px){
  .rk{grid-template-columns:2em minmax(0,1fr) 4em}
  .rk .opt-col{display:none}
  .desafio{grid-template-columns:1fr}
  .desafio .pos{grid-row:auto;font-size:2.4rem}
  .camino .cs{font-size:.6rem}
  .camino .cs i{width:32px;height:32px}
  .camino::before{top:20px}
  .lrow{grid-template-columns:1.8em minmax(0,1fr) 6.4em}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Estética Figma "El Barrio Decide": blanco, bloques planos de color, esquinas rectas,
   líneas de corte punteadas azules (#0E74B5) y rótulos grises (#676767) como en las tarjetas impresas. ===== */
:root{--bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F1F1F1;--ink:#1E1E1E;--muted:#676767;--line:#C9C9C9;--dash:#0E74B5;--r:4px;--warnt:#FBE3E5}
body{background:#FFFFFF}
body::before{background:#FFFFFF}
header.top{background:#FFFFFF;border-bottom:1.5px dashed var(--dash)}
.lead{font-style:normal;font-weight:600;color:var(--muted)}
h1{letter-spacing:-.01em}
.etapa{display:inline-block;align-self:flex-start;background:var(--accent);color:#fff;font-size:.8rem;letter-spacing:.03em;padding:4px 10px;border-radius:0}
nav.tabs a{border-radius:2px}
nav.tabs a[aria-current="page"]{border-radius:2px}
.chip{border-radius:2px}
.seg{border-radius:0}
.seg.now{box-shadow:none;outline:2px dashed var(--sc);outline-offset:2px}
.panel{border:1.5px dashed var(--dash);border-radius:var(--r)}
.panel.plain{border-color:var(--dash)}
.card{border:1.5px dashed var(--dash);border-radius:var(--r)}
.card.mine{border:2px solid var(--accent)}
.empty{border:1.5px dashed var(--dash);border-radius:var(--r)}
.notice{border-radius:var(--r)}
details.guia{border:1.5px dashed var(--dash);border-radius:var(--r)}
.btn{border-radius:var(--r)}
.btn.ghost{border:1.5px dashed var(--dash)}
.mesa span{border:1.5px dashed var(--dash);border-radius:var(--r)}
.zone{border:1.5px dashed var(--dash);border-radius:var(--r)}
.zone .sw,.zchip .sw{border:1px solid rgba(0,0,0,.25)}
.legend .it{border-radius:var(--r);border-width:1.5px;border-style:solid}
.legend .it .sw{border:1px solid rgba(0,0,0,.25)}
.kpi{border:0;border-radius:0;background:var(--accent);color:#fff}
.kpi b,.kpi span{color:#fff!important}
.desafio{border:1.5px dashed var(--dash);border-radius:var(--r)}
.reto{border-radius:var(--r);border-left:8px solid var(--accent)}
.step{border-radius:var(--r);border-width:0;background:var(--sc);color:#fff}
.step .etapa{background:#fff;color:var(--sc)}
.step .btn{background:#fff;border-color:#fff}
.step .urltxt{background:rgba(255,255,255,.9)}
.qr{border-radius:0}
.subtabs{border-bottom:1.5px dashed var(--dash)}
.formula{border-radius:var(--r);background:#F4F4F4}
.mcat{border-radius:var(--r)}
.ficha{background:#FFFFFF;border-radius:var(--r)}
.fh{border-radius:0}
.fb{border-radius:var(--r)}
.sobre,.ejemplo{border-radius:var(--r)}
.pcard,.peso{border-radius:var(--r)}
.camino .cs i{border-color:#fff}
.winner{border-radius:var(--r)}
.overlay .box{border-radius:var(--r)}
.toast{border-radius:2px}
.preview,.bank,.votebar{border-radius:var(--r)}
table.heat td{border-radius:0}
.etapa[style]{background:transparent!important;padding:0!important}
.zchip{color:var(--ink)}
/* ===== v6 · vistas conectadas: inicio, secretario, participante, pantalla y admin ===== */
:root{--gob:"Goblin One",var(--f);--hachi:"Hachi Maru Pop",var(--f)}
.gob{font-family:var(--gob);font-weight:400;letter-spacing:0}
.hachi{font-family:var(--hachi);font-weight:400}
h1{font-family:var(--gob);font-weight:400;letter-spacing:0;line-height:1.15}
h1.logo{font-family:var(--f)}
.rolchip{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;background:var(--rc,#1E1E1E);color:#fff;white-space:nowrap}
nav.links{display:flex;gap:6px;flex:1 1 200px;flex-wrap:wrap;justify-content:flex-end}
nav.links a{font-size:.82rem;font-weight:700;color:var(--ink);text-decoration:none;padding:4px 10px;border:1.5px dashed var(--dash);white-space:nowrap}
nav.links a:hover{background:var(--sunk)}
body:not([data-rol="sec"]) .track,body:not([data-rol="sec"]) .trackinfo{display:none}
body[data-rol="pantalla"] header.top{display:none}
body[data-rol="pantalla"]{padding-top:18px;padding-bottom:18px}
body[data-rol="pantalla"] #app{max-width:1680px}
body[data-rol="admin"]{background:#F2F2F2}
body[data-rol="admin"]::before,body[data-rol="admin"] header.top{background:#F2F2F2}
body[data-rol="admin"] .panel{background:#fff;border:1px solid #CFCFCF}
body[data-rol="sec"] header.top{border-bottom:5px solid var(--accent)}
body[data-rol="part"] header.top{position:static}
body[data-rol="part"] .pills{display:none}

/* inicio */
.mesacards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.mesacard{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--mc);color:#fff}
.mesacard h3{font-family:var(--gob);font-weight:400;font-size:1.5rem}
.mesacard .st{font-size:.78rem;font-weight:800;background:#fff;color:var(--ink);align-self:flex-start;padding:2px 8px}
.mesacard .btn{background:#fff;border-color:#fff;color:var(--ink)}
.mesacard .urltxt{background:rgba(255,255,255,.92)}
.mc1{--mc:#4DA4DD}.mc2{--mc:#D0387C}.mc3{--mc:#8A54B3}.mc4{--mc:#03BBAD}
.indic{display:grid;gap:10px}
.indic .it{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;padding:10px 0;border-top:1.5px dashed var(--dash)}
.indic .it:first-child{border-top:0}
.indic .n{background:var(--sc);color:#fff;font-weight:800;text-align:center;padding:6px 0;font-size:.85rem}
.indic .who{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.indic .who span{font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;background:var(--sunk)}
.reglas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.reglas div{border-left:6px solid var(--e0);background:#F6F6F6;padding:10px 12px;font-size:.88rem;font-weight:600}

/* secretario */
.nextbar{margin-top:26px;border:2px solid var(--accent);background:var(--accent-t);padding:16px 18px;display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.nextbar .t{display:flex;flex-direction:column;gap:2px;max-width:60ch}
.nextbar .t b{font-size:1.05rem}
.nextbar .t span{font-size:.88rem;font-weight:500}
.nextbar .btn{font-size:1.05rem;padding:13px 22px}
.mchk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.mchk span{font-size:.8rem;font-weight:800;padding:4px 10px;background:var(--sunk);color:var(--muted)}
.mchk span.ok{background:var(--ok);color:#fff}
.qrbig{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.qrbig .qr{width:150px}
@media (max-width:480px){.qrbig{grid-template-columns:1fr}}
.redac{border:1.5px solid var(--ink);padding:12px;display:flex;flex-direction:column;gap:10px;background:#fff}
.redac .plant{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px}
.redac .plant label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:800}
.redac .plant input{padding:7px 9px;font-size:.88rem}
.tabsm{display:flex;gap:0}
.tabsm button{font:inherit;font-size:.82rem;font-weight:800;padding:6px 12px;border:1.5px solid var(--ink);background:#fff;cursor:pointer}
.tabsm button+button{border-left:0}
.tabsm button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* tarjeta de problema completa */
.prob{background:#fff;border:1.5px dashed var(--dash);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.prob .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.prob .fr{font-size:1.02rem;font-weight:700;line-height:1.35}
.prob.sel{border:2.5px solid var(--dc,var(--accent))}
.prob.mine{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 5%,#fff)}
.partes{display:flex;flex-wrap:wrap;gap:4px}
.parte{font-size:.7rem;font-weight:700;color:#fff;background:var(--pc);padding:3px 7px;line-height:1.25}
.parte i{font-style:normal;font-weight:800;opacity:.85;margin-right:4px;text-transform:uppercase;letter-spacing:.04em;font-size:.62rem}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.numrank{font-family:var(--gob);font-size:1.6rem;color:var(--dc,var(--accent));line-height:1}

/* redactor de desafíos */
.redactor{display:flex;flex-direction:column;gap:12px}
.paso{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border:1.5px dashed var(--dash);background:#fff}
.paso .pn{width:40px;height:40px;background:var(--e13);color:#fff;font-family:var(--gob);font-size:1.2rem;display:flex;align-items:center;justify-content:center}
.paso b{display:block}
.paso small{display:block;color:var(--muted);font-weight:500;margin-bottom:6px;font-size:.82rem}
.paso .row{gap:6px}
.sug{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.sug button{font:inherit;font-size:.76rem;font-weight:700;border:1.5px solid var(--e13);background:#fff;color:var(--e13);padding:2px 9px;cursor:pointer}
.sug button[aria-pressed="true"]{background:var(--e13);color:#fff}
.check{display:flex;flex-direction:column;gap:6px}
.check label{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;font-size:.88rem;font-weight:600}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--e13)}
.check .h{font-size:.7rem;font-weight:800;padding:1px 7px;white-space:nowrap}
.check .h.si{background:#D7F0DB;color:#1E6B2A}.check .h.no{background:#FBE1E3;color:#9B1F2A}
.oficial{display:flex;flex-direction:column;gap:10px;padding:16px 18px;background:#fff;border:2px solid var(--dc);position:relative}
.oficial .k{font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--dc)}
.oficial .q{font-size:1.12rem;font-weight:700;line-height:1.35}
.oficial.pinned{background:color-mix(in srgb,var(--dc) 10%,#fff)}
.pinchip{font-size:.72rem;font-weight:800;padding:3px 9px;background:var(--dc);color:#fff}
.actor{font-size:.7rem;font-weight:700;padding:2px 8px;border:1.2px solid var(--muted);color:var(--muted)}

/* mercado */
.plato{padding:0;position:relative;width:min(100%,320px)}
.plato .pin{position:absolute;inset:14%;display:flex;align-items:center;justify-content:center}
.plato textarea{width:100%;height:2.6em;max-height:100%;overflow-y:auto;padding:0;line-height:1.3;text-align:center;font-size:1rem}
.plato textarea:focus{outline:none}
.plato:focus-within{border-color:var(--ink)}
.bank.compact{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px 14px;padding:8px 12px}
.bank.compact .coins{flex:1 1 220px;max-width:380px;gap:2px}
.bank.compact .tot{font-size:.95rem;font-weight:800;white-space:nowrap}
.bank.compact .checks span{font-size:.64rem;padding:2px 6px}
.coins i.over{background:transparent!important;box-shadow:inset 0 0 0 2px #FF7C66}

/* menú de proyecto (ficha con gráfica de menú) */
.menucard{background:#fff;border:1.5px solid #1E1E1E;display:flex;flex-direction:column;min-width:0;position:relative}
.menucard .mc-des{background:var(--dcol);color:#fff;padding:9px 14px;font-size:.84rem;font-weight:600;line-height:1.3}
.menucard .mc-des b{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.menucard header{padding:14px 16px 4px;display:flex;flex-direction:column;gap:3px}
.mc-mesa{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menucard h3{font-family:var(--gob);font-weight:400;font-size:1.45rem;line-height:1.12}
.mc-bajada{padding:2px 16px 14px;font-size:1rem;font-weight:600;line-height:1.38}
.mc-secs{display:grid;grid-template-columns:1fr 1fr;border-top:1.5px dashed var(--dash)}
.mc-sec{padding:10px 14px 12px;border-top:6px solid var(--mc);min-width:0}
.mc-sec:nth-child(odd){border-right:1.5px dashed var(--dash)}
.mc-t{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;color:color-mix(in srgb,var(--mc) 72%,#1E1E1E)}
.mc-t .gob{font-size:1.05rem}.mc-t .hachi{font-size:.86rem}
.mc-sec small{display:block;font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mc-sec ul{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px;font-size:.86rem;font-weight:600}
.mc-sec li{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dotted #B9B9B9;padding-bottom:2px}
.mc-sec li span:last-child{font-weight:800;color:color-mix(in srgb,var(--mc) 70%,#1E1E1E);flex:none}
.mc-sec li.lib span:first-child{font-style:italic}
.mc-sec li.vac{color:#AAA;border:0}
.menucard .coins{padding:0 14px 12px}
.menucard .fres{border-top:1.5px dashed var(--dash)}
.mc-score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:10px 16px;background:#F5F5F5;border-top:1.5px dashed var(--dash)}
.mc-score .rk1{font-family:var(--gob);font-size:2.4rem;line-height:1;color:var(--e22);grid-row:span 2}
.mc-score .pts{font-family:var(--gob);font-size:1.6rem;line-height:1}
.mc-score .pts small{font-family:var(--f);font-size:.8rem;font-weight:700;color:var(--muted);margin-left:6px}
.critbars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;grid-column:1/-1}
.critbars div{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.critbars .trk{height:8px;background:#DDD;margin-top:2px}
.critbars .trk b{display:block;height:100%;background:var(--e22);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.menucard.lead1{box-shadow:0 0 0 4px var(--e22)}

/* participante */
.part .stepper button{width:46px;height:46px}
.evalcard{display:flex;flex-direction:column;gap:10px;background:#fff;border:1.5px solid #1E1E1E;padding:14px 16px}
.evalcard .des{font-size:.8rem;font-weight:600;padding:8px 10px;background:color-mix(in srgb,var(--dcol) 14%,#fff);border-left:5px solid var(--dcol)}
.evalcard .des b{display:block;font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dcol)}
.evalcard h3{font-family:var(--gob);font-weight:400;font-size:1.3rem}
.evalcard .baj{font-weight:600;line-height:1.38}
.evalcard.done{border-color:var(--e22);box-shadow:inset 6px 0 0 var(--e22)}

/* pantalla */
.pv{display:flex;flex-direction:column;gap:20px;min-height:calc(100vh - 36px)}
.pv-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.pv-prog{display:flex;flex-direction:column;gap:6px}
.pv-prog .l{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.pv-prog .l b{font-family:var(--gob);font-weight:400;font-size:1.25rem}
.pv-prog .l span{font-size:.9rem;font-weight:700;color:var(--muted)}
.pprog{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.pprog i{height:10px;background:#E8E8E8;display:block}
.pprog i.done{background:var(--sc)}
.pprog i.now{background:var(--sc);animation:pulso 1.8s ease-in-out infinite}
@keyframes pulso{50%{opacity:.45}}
.pv h1{font-size:clamp(2rem,3.4vw,3.3rem)}
.pv .sub{font-size:1.1rem;font-weight:600;color:var(--muted);max-width:80ch}
.pv-body{flex:1;display:flex;flex-direction:column;gap:20px}
.mstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:auto}
.ms{display:flex;flex-direction:column;gap:3px;padding:10px 12px;background:#F6F6F6;border-top:6px solid var(--mc)}
.ms b{font-family:var(--gob);font-weight:400;font-size:1.1rem}
.ms .st{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--sc)}
.ms .met{font-size:.88rem;font-weight:700}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw,320px),1fr));gap:12px;align-content:start}
.pv .prob .fr{font-size:var(--pfs,1.2rem)}
.loader{display:flex;gap:8px;align-items:center;justify-content:center}
.loader i{width:14px;height:14px;background:var(--accent);display:block;animation:salto 1.2s infinite ease-in-out}
.loader i:nth-child(2){animation-delay:.15s}.loader i:nth-child(3){animation-delay:.3s}
@keyframes salto{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:none;opacity:1}}
.slot3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.dslot{display:flex;flex-direction:column;gap:12px;padding:18px;border:2px dashed var(--dc);background:#fff;min-height:220px}
.dslot .pq{font-size:.95rem;font-weight:600;color:var(--muted);line-height:1.35}
.dslot .k{font-size:.8rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--dc)}
.dslot.listo{border-style:solid;background:var(--dc);color:#fff}
.dslot.listo .k,.dslot.listo .pq{color:#fff}
.dslot .q{font-size:clamp(1.15rem,1.7vw,1.55rem);font-weight:700;line-height:1.3}
.dslot .actor{border-color:#fff;color:#fff}
.dslot .pinchip{background:#fff;color:var(--ink)}
.fijos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;position:sticky;top:0;z-index:2;background:#fff;padding:6px 0}
.fijo{padding:10px 12px;background:var(--dcol);color:#fff;font-size:.86rem;font-weight:600;line-height:1.3}
.fijo b{display:block;font-family:var(--gob);font-weight:400;font-size:1rem}
.fijo.sin{background:#EEE;color:var(--muted)}
.mesagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.mesagrid.dos{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.mesagrid.dos{grid-template-columns:1fr}.fijos,.mstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.armando{min-height:260px;border:2px dashed #CFCFCF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#9A9A9A;font-weight:700;text-align:center;padding:20px}
.armando b{font-family:var(--gob);font-weight:400;font-size:1.4rem;color:#BDBDBD}
.big .menucard h3{font-size:clamp(1.6rem,2.2vw,2.3rem)}
.big .mc-bajada{font-size:clamp(1.05rem,1.35vw,1.3rem)}
.big .mc-sec ul{font-size:clamp(.88rem,1vw,1.02rem)}
.pv .lrow{height:80px;grid-template-columns:2.6em minmax(0,1fr) 9em}
.pv .lrow .fr2{font-weight:700;font-size:1.02rem;line-height:1.28;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pv .lrow .pos{font-family:var(--gob);font-weight:400}
.lrow .meta{display:flex;gap:6px;align-items:center;margin-top:4px}
.lrow .sc{position:relative}
.plus{position:absolute;right:0;top:-18px;font-weight:900;color:var(--e12);font-size:1rem;animation:sube 1.2s forwards;pointer-events:none}
@keyframes sube{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.bump{display:inline-block;animation:bump .7s}
@keyframes bump{0%{transform:scale(1.45);color:var(--e12)}100%{transform:none}}
.pv .podio .pcard h3{font-size:1.05rem;line-height:1.3;font-weight:700}
.pv .podio .pcard:first-child h3{font-size:1.2rem}
.pv .podio .pcard .big{font-family:var(--gob);font-weight:400}
.gracias{background:var(--e3);color:#fff;padding:26px 28px;display:flex;flex-direction:column;gap:10px}
.gracias h2{font-family:var(--gob);font-weight:400;font-size:clamp(1.6rem,2.6vw,2.4rem);color:#fff}
.gracias p{font-size:1.15rem;font-weight:600;max-width:70ch}
.adm-mesas{display:flex;flex-direction:column}
.adm-mesas .it{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #DDD}
.adm-mesas select{width:auto}
@media (max-width:600px){.adm-mesas .it{grid-template-columns:1fr}}

/* ============ CÁLCULOS ============ */
function calcProblemas(){
  const P=S.data.problemas,N=P.length;
  const cnt={};OBST.forEach(c=>cnt[c.id]=0);P.forEach(p=>cnt[obstCat(p)]=(cnt[obstCat(p)]||0)+1);
  const peso={};OBST.forEach(c=>peso[c.id]=N?cnt[c.id]/N*OBST.length:0);
  const votos={};let totalVotos=0;
  S.data.votos.forEach(v=>Object.entries(v.asignacion||{}).forEach(([k,n])=>{votos[k]=(votos[k]||0)+(+n||0);totalVotos+=(+n||0)}));
  const lista=P.map(p=>{const zonas=ZONAS.map(z=>z.id).filter(z=>(p.zonas||[]).includes(z));const tf=S.estado.transversalidad?1+TRANSV*Math.max(0,zonas.length-1):1;const v=votos[p.id]||0;const w=peso[obstCat(p)]||0;return {p,id:p.id,cat:obstCat(p),zonas,votos:v,peso:w,tf,puntaje:v*w*tf,mesa:+p.mesa}})
   .sort((a,b)=>b.puntaje-a.puntaje||b.votos-a.votos||(a.p.ts||0)-(b.p.ts||0));
  const con=S.data.votos.filter(v=>Object.values(v.asignacion||{}).some(n=>n>0));
  const porMesa={};MS.forEach(m=>porMesa[m]=con.filter(v=>+v.mesa===m).length);
  return {N,cnt,peso,lista,totalVotos,votantes:con.length,porMesa}
}
/* top 3 con problemas distintos entre sí: si dos relatos traen el mismo obstáculo, pasa el siguiente */
function calcTop3(){
  const C=calcProblemas();const out=[],vistos=new Set();
  for(const g of C.lista){if(!(g.puntaje>0))break;const k=obstKey(g.p);if(vistos.has(k))continue;vistos.add(k);out.push(g.id);if(out.length===3)break}
  for(const g of C.lista){if(out.length===3)break;if(g.puntaje>0&&!out.includes(g.id))out.push(g.id)}
  return out
}

}

function calcRanking(){
  const evs=S.data.evaluaciones;

    const notas=evs.map(e=>(e.notas||{})[s.id]).filter(evalCompleta);
    const k=notas.length,avg=f=>k?notas.reduce((a,n)=>a+n[f],0)/k:NaN;
    const r={...s,k,tokens:tokensDe(s)};CRITERIOS.forEach(([c])=>r[c]=avg(c));
    r.puntaje=k?CRITERIOS.reduce((a,[c])=>a+r[c],0)/CRITERIOS.length:NaN;return r
  }).sort((a,b)=>(Number.isFinite(b.puntaje)?b.puntaje:-1)-(Number.isFinite(a.puntaje)?a.puntaje:-1)||a.mesa-b.mesa)
}

function baseURL(){return (S.estado.url||ARTIFACT_URL||(location.protocol.startsWith('http')?location.origin+location.pathname:'')).replace(/#.*$/,'')}
function qrSVG(text){
  if(typeof qrcode!=='function'||!text)return '';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`
}

/* ============ UTILIDADES DE INTERFAZ ============ */
function tween(el,to,dec=1){
  if(!el)return;const from=Number.isFinite(el._v)?el._v:0;el._v=to;
  if(!Number.isFinite(to)){el.textContent='–';return}
  if(Math.abs(from-to)<1e-9){el.textContent=fmt(to,dec);return}
  const t0=performance.now(),D=800;
  const step=t=>{const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e,dec);if(k<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
  if(to>from){el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump')}
}
function flip(cont,orden){
  const actual=[...cont.children].filter(c=>orden.includes(c));
  if(actual.length===orden.length&&actual.every((c,i)=>c===orden[i]))return;
  const first=new Map(orden.map(e=>[e,e.getBoundingClientRect()]));
  orden.forEach(e=>cont.appendChild(e));
  orden.forEach(e=>{const f=first.get(e),l=e.getBoundingClientRect();const dx=f.left-l.left,dy=f.top-l.top;if(!dx&&!dy)return;
   e.style.transition='none';e.style.transform=`translate(${dx}px,${dy}px)`;
   requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.transition='transform .8s cubic-bezier(.2,.8,.2,1)';e.style.transform=''}))});
}

function tiempoRestante(m){const d=mesaDoc(m);if(!hayJornada()||!d.faseInicio)return null;return d.faseInicio+(dur(faseMesa(m))+(+d.extra||0))*60000-Date.now()}
function fmtT(ms){const s=Math.round(Math.abs(ms)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function pintarTrack(m){
  const tr=$('#track'),info=$('#trackinfo');
  if(!hayJornada()){tr.innerHTML='';info.innerHTML='<span class="muted">Sin jornada activa</span>';return}
  const f=faseMesa(m),idx=FI(f),d=mesaDoc(m);
  const rest=tiempoRestante(m),total=(dur(f)+(+d.extra||0))*60000;
  const pct=rest==null?0:Math.max(0,Math.min(100,(1-rest/total)*100));
  tr.innerHTML=FASES.map((x,i)=>`<div class="seg ${i<idx?'done':i===idx?'now':''}" style="--sc:var(--e${x.e})" title="${x.n} ${esc(x.t)}"><b>${x.n}</b><span>${x.c}</span>${i===idx?`<i class="fill" style="width:${pct}%"></i>`:''}</div>`).join('');
  const ses=sesionActual();
  info.innerHTML=`<span>Mesa ${m} · Etapa ${FASEM[f].n} · ${esc(FASEM[f].t)}</span><span>${rest==null?'':rest>=0?`<span class="timer">${fmtT(rest)}</span> restantes`:`<span class="timer over">+${fmtT(rest)}</span> sobre el tiempo`}${ses&&ses.nombre?` · <span class="muted">${esc(ses.nombre)}</span>`:''}</span>`;
}

function nextCfg(m,f){
  switch(f){
   case 'inicio':return {t:'Comenzar el mapeo',d:'Abre el registro de relatos de tu mesa.',to:'registro'};
   case 'registro':{const n=S.data.problemas.filter(p=>+p.mesa===m).length;return {t:'Terminar mapeo y abrir la votación',d:n?`${n} relato${n>1?'s':''} registrado${n>1?'s':''}. La votación empieza cuando las ${MESAS} mesas terminen el mapeo.`:'Registra al menos un relato antes de pasar a la votación.',to:'votacion',dis:!n,conf:true}}
   case 'votacion':return todasEn('votacion')?{t:'Cerrar votación y pasar a desafíos',d:'Cuando los vecinos de tu mesa hayan votado. Los desafíos se definen cuando las 4 mesas cierran la votación.',to:'desafios',conf:true}:{t:'Cerrar votación y pasar a desafíos',d:`La votación aún no comienza: falta${faltanEn('votacion').length>1?'n':''} ${mesasTxt(faltanEn('votacion'))}.`,dis:true};
   case 'desafios':{const i=desafioDeMesa(m);const ok=i!=null&&desOf(i);return {t:'Abrir el mercado de soluciones',d:ok?`Trabajarán el Desafío N°${i+1}.`:'Primero fijen el desafío con el que trabajará la mesa (paso 4).',to:'mercado',dis:!ok}}
   case 'mercado':{const s=solDe(m);const ok=s&&s.estado==='lista';return {t:'Abrir la evaluación',d:ok?'La evaluación empieza cuando las 4 mesas entreguen su proyecto.':'Entreguen el proyecto (botón «Entregar proyecto») antes de pasar a la evaluación.',to:'evaluacion',dis:!ok}}
   case 'evaluacion':return todasEn('evaluacion')?{t:'Cerrar evaluación y pasar al cierre',d:'Cuando los vecinos de tu mesa hayan evaluado.',to:'cierre',conf:true}:{t:'Cerrar evaluación y pasar al cierre',d:`La evaluación aún no comienza: falta${faltanEn('evaluacion').length>1?'n':''} ${mesasTxt(faltanEn('evaluacion'))}.`,dis:true};
   default:return null
  }
}
function pintarNext(m,f){
  const el=$('#s-next');const c=nextCfg(m,f);
  if(!c){el.innerHTML='';el.dataset.k='';return}

}

function modoPantalla(){
  if(!hayJornada())return 'nada';
  const f=minFase();
  if(f==='inicio')return MS.some(m=>FI(faseMesa(m))>=1)||S.data.problemas.length?'mapeo':'inicio';
  if(f==='registro')return 'mapeo';

  if(f==='mercado')return entregadas()===MESAS?'menus':'mercado';
  if(f==='evaluacion')return 'evaluacion';
  return 'cierre';
}

   for(const [mesa,soy,quiero,justo,obst,zonas,ubic] of P){const id='ej-'+rid();ids.push(id);const p={mesa,soy,quiero,justo,obst,soyOtro:'',quieroOtro:'',justoOtro:'',obstOtro:'',zonas,ubic,redaccion:'pl',ejemplo:true,ts:t0+=1000};p.frase=fraseAuto(p);p.plantilla={quien:soyFrase(p),quiere:quieroFrase(p),obst:low(obstTxt(p)),donde:''};await put('problemas',id,p)}
   await esperar(()=>ids.every(probById));
   const V=[[0,0,0,1,6,6,7,7,2,9],[1,1,4,4,0,6,7,3,8,10],[2,2,2,9,9,6,0,1,4,11],[0,6,6,4,4,1,7,9,3,5],[6,6,9,9,2,0,4,1,10,11],[0,0,4,4,7,7,6,9,1,2],[3,3,9,9,6,0,4,7,2,8],[4,4,0,1,6,6,9,2,11,5]];
   for(let k=0;k<V.length;k++){const a={};V[k].forEach(i=>a[ids[i]]=(a[ids[i]]||0)+1);await put('votos','ej-'+rid(),{asignacion:a,mesa:k%MESAS+1,ejemplo:true,ts:Date.now()})}
   await esperar(()=>S.data.votos.filter(v=>v.ejemplo).length>=V.length);
   const T=calcTop3();await put('comun','top3',{ids:T,ts:Date.now()});
   for(let i=0;i<T.length;i++){const p=probById(T[i]);const bid='ej-'+rid();const tx=ejemplosDesafio(p)[0][1];const act=[ACTORES[0],ACTORES[1],ACTORES[2+i]];await put('buzon',bid,{idx:i,pid:T[i],texto:tx,actores:act,mesa:i+1,fuente:'redactor',ejemplo:true,ts:Date.now()});await put('comun','des-'+i,{idx:i,pid:T[i],texto:tx,actores:act,mesa:i+1,fuente:'redactor',bid,ts:Date.now()})}
   const PIN={1:0,2:1,3:2,4:0};await esperar(()=>top3().length===T.length);
   for(const m of MS)await setMesa(m,{desafio:Math.min(PIN[m],T.length-1)});
   const SOL=[[1,['F3','N2','C4','V1'],'Veredas despejadas','Una franja peatonal continua en Pocuro y Manuel Montt, con lugares autorizados para estacionar motos señalados en la calle y en las apps, y puntos de entrega acordados con los vecinos.'],
    [2,['F1','N4','C2','V2'],'Punto de espera Tobalaba','Una zona de espera para repartidores frente a los locales de Tobalaba, con aviso de pedido listo para que nadie espere en la vereda, y vecinos que retiran sus pedidos a tiempo.'],
    [3,['F3','N6','C7','V6'],'Calle compartida','Una calle piloto donde peatones tienen prioridad: franja despejada, campaña de prioridad peatonal y un compromiso de buenas prácticas entre comercios y plataformas, evaluado por los vecinos.'],
    [4,['F5','N1','C5','V3'],'Barrio en orden','Demarcación de zonas de espera y entrega frente a edificios de Pocuro, con tiempos máximos de detención, horarios de retiro coordinados e indicaciones claras de entrega.']];
   for(const [m,compras,nombre,plato] of SOL)await put('soluciones','mesa-'+m,{mesa:m,compras,libres:{fis:'',nor:'',com:'',vec:m===2?'Reuniones mensuales con repartidores':''},plato,texto:'El espacio físico ordena la espera, la norma lo respalda, el comercio avisa a tiempo y los vecinos reportan y evalúan.',porque:'La vereda bloqueada en horario punta.',falla:'Si el comercio no avisa, los repartidores vuelven a esperar en la vereda.',responsables:'Municipio demarca; comercios coordinan retiros; vecinos reportan.',cambio:'Veredas despejadas entre 19 y 22 h.',zonas:['R','C'],lugar:['Pocuro','Tobalaba','Barrio Italia','Pocuro'][m-1],foto:'',nombre,estado:'lista',ejemplo:true,ts:Date.now()});
   const BASE={1:[5,4,4,5],2:[4,5,3,4],3:[3,4,4,3],4:[4,3,3,3]};
   for(let e=0;e<8;e++){const mesa=e%MESAS+1;const notas={};MS.filter(x=>x!==mesa).forEach(x=>{const bb=BASE[x].map((v,j)=>Math.max(1,Math.min(5,v+((e+j+x)%3===0?-1:0))));notas['mesa-'+x]={a:bb[0],d:bb[1],f:bb[2],v:bb[3]}});await put('evaluaciones','ej-'+rid(),{notas,mesa,ejemplo:true,ts:Date.now()})}
   msg.innerHTML='Listo: 12 relatos, 8 votantes, 3 desafíos, 4 proyectos y 8 evaluaciones. Usa «Mover todas las mesas a» para revisar cada etapa en la <a href="#pantalla" target="_blank" rel="noopener">pantalla</a>.';toast('Datos de ejemplo cargados');
  }catch(e){console.warn(e);msg.textContent='No se pudo cargar el ejemplo. Revisa la conexión y las reglas de la base de datos.'}
  btn.disabled=false;
}

window.addEventListener('hashchange',mount);
mount();
(async function init(){
  S.esAdmin=!!LS.get('bd.fac',false);
  let db=null;
  const cfg=FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId;
  if(cfg&&window.firebase){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){console.warn(e);S.modo='error';refresh();return}}
  else if(window.claude&&claude.use){try{db=await claude.use('db')}catch(e){}}
  if(!db){S.modo=cfg&&!window.firebase?'error':'local';loadLocal();refresh();return}
  S.db=db;S.modo='compartido';let ok=false;
  const tm=setTimeout(()=>{if(!ok)toast('Sin respuesta del servidor todavía; revisa la conexión')},10000);
  db.doc('control/estado').onSnapshot(snap=>{
   if(!snap.metadata||!snap.metadata.fromCache){ok=true;clearTimeout(tm)}
   const prev=S.estado;S.estado=snap.exists?{...S.estado,...snap.data()}:{...S.estado,tid:''};
   if(!S.estado.duraciones)S.estado.duraciones={...DUR0};
   if(prev.tid!==S.estado.tid||S.subs.length===0){subscribeTaller();resetBorradores()}
   refresh();
  },e=>{console.warn(e);S.modo='error';refresh()});
  db.collection('control/estado/sesiones').onSnapshot(snap=>{S.sesiones=snap.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.warn(e));
  refresh();
})();
</script>
