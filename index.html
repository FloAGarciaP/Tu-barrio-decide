<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El Barrio Decide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;500;600;700;800;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: claves gráficas del Figma "Metodologías": Gabarito, tarjetas de color con franja blanca
   y etiqueta gris, bordes punteados. Etapa 1 = azul/magenta/morado/turquesa; Etapa 2 = ocre/verde/rojo/menta. Barra de recorrido fija arriba: dónde estoy y cuánto tiempo queda.
   Tema claro único, deliberado para calzar con el material impreso. */
:root{
  color-scheme:light;
  --bg:#F7F0E1; --surface:#FFFCF5; --sunk:#EFE5D2; --ink:#1D1A17; --muted:#6A6157; --line:#CDBFA8;
  --e0:#03BBAD; --e0t:#CDEFEB; --e11:#4DA4DD; --e11t:#D6EAF7; --e12:#D0387C; --e12t:#F5D2E2; --e13:#8A54B3; --e13t:#E5D8EF;
  --e21:#CAA057; --e21t:#F2E5CC; --e22:#2FA93F; --e22t:#CDEBD1; --e3:#E5414C; --e3t:#FAD3D6;
  --d1:#D0387C; --d2:#8A54B3; --d3:#4DA4DD;
  --soy:#4DA4DD; --quiero:#D0387C; --justo:#8A54B3; --obst:#03BBAD;
  --uso:#03BBAD; --tra:#0E74B5; --dash:#0E74B5; --label:#676767;
  --m-fis:#CAA057; --m-nor:#2FA93F; --m-com:#E5414C; --m-vec:#01DB9D;
  --chip:#3D3D3D; --chip-off:#BBB4AF; --on-accent:#FFFFFF; --ok:#2FA93F; --warn:#B4852F; --bad:#E5414C; --warnt:#FAD3D6;
  --accent:var(--e0); --accent-t:var(--e0t);
  --z-R:#FFEE00; --z-C:#C623CF; --z-V:#2918B5; --z-P:#12BA26;
  --f:"Gabarito","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
body[data-e="0"]{--accent:var(--e0);--accent-t:var(--e0t)}
body[data-e="11"]{--accent:var(--e11);--accent-t:var(--e11t)}
body[data-e="12"]{--accent:var(--e12);--accent-t:var(--e12t)}
body[data-e="13"]{--accent:var(--e13);--accent-t:var(--e13t)}
body[data-e="21"]{--accent:var(--e21);--accent-t:var(--e21t)}
body[data-e="22"]{--accent:var(--e22);--accent-t:var(--e22t)}
body[data-e="3"]{--accent:var(--e3);--accent-t:var(--e3t)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{--accent-ink:color-mix(in srgb,var(--accent) 66%,#1D1A17);background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--f);line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4.2vw,2.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.28rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
ul,ol{margin:0;padding-left:1.2em}
.wrap{max-width:1180px;margin:0 auto}
.narrow{max-width:600px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.lead{font-style:italic;font-weight:500;font-size:1.1rem;max-width:56ch}
.etapa{font-weight:800;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header + recorrido */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:2px dashed var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 22px;padding:8px max(16px,env(safe-area-inset-left,0px)) 10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;flex-direction:column;gap:8px}
.top .l1{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap}
.brand{text-decoration:none;white-space:nowrap}
.logo{display:inline-flex;flex-direction:column;font-weight:800;line-height:.86;letter-spacing:-.01em;font-size:1.05rem}
.logo b{font-weight:800;color:#3D3D3D}
.logo b+b{color:#fff;-webkit-text-stroke:.09em #3D3D3D;paint-order:stroke fill;font-size:1.32em}
.logo.big{font-size:clamp(2.4rem,7vw,4.4rem)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:end}
.vecina{width:clamp(120px,22vw,220px);height:auto;display:block}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero .vecina{display:none}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 300px;min-width:0;scrollbar-width:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:5px 10px;border-radius:999px;font-size:.84rem;font-weight:600}
nav.tabs a .n{font-size:.7rem;font-weight:800;margin-right:4px}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--on-accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:4px;background:var(--chip);color:#fff;white-space:nowrap}
.chip.off{background:var(--chip-off)}
.chip i{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block}
.chip.live i{background:#7BE08E} .chip.local i{background:#F2C14E}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;align-items:stretch}
.seg{position:relative;border-radius:6px;padding:4px 6px 5px;background:var(--sunk);color:var(--muted);font-size:.68rem;font-weight:700;line-height:1.2;min-width:0;overflow:hidden}
.seg b{display:block;font-size:.66rem;font-weight:800;letter-spacing:.04em}
.seg span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg.done{background:color-mix(in srgb,var(--sc) 22%,var(--sunk));color:var(--ink)}
.seg.now{background:var(--sc);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--sc)}
.seg .fill{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85)}
.trackinfo{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.timer.over{color:var(--bad)}
@media (max-width:700px){.seg span{display:none}.seg{padding:4px 4px 6px;text-align:center}header.top{position:static}.preview{padding:10px 12px;font-size:.86rem}}

/* superficies */
.panel{background:var(--surface);border:2px dashed var(--accent);border-radius:var(--r);padding:20px}
.panel.plain{border-color:var(--line)}
.panel.fill{background:var(--accent-t);border-style:solid}
.notice{border-radius:10px;padding:12px 14px;background:var(--warnt);font-size:.9rem;font-weight:500}
.notice.info{background:var(--e0t)}
.notice.good{background:var(--e21t)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
details.guia{border:2px dashed var(--line);border-radius:12px;background:var(--surface)}
details.guia summary{cursor:pointer;padding:10px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.guia summary::-webkit-details-marker{display:none}
details.guia summary::after{content:"+";font-weight:800;color:var(--accent)}
details.guia[open] summary::after{content:"–"}
.guiabody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.guiabody h4{margin:0;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.clave{border-left:4px solid var(--accent);background:var(--accent-t);padding:8px 12px;border-radius:0 8px 8px 0;font-weight:600}

/* formularios */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.93rem}
label.f small{font-weight:500;color:var(--muted)}
input[type=text],input[type=number],input[type=url],input[type=date],input[type=password],textarea,select{font:inherit;font-weight:500;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{font-weight:800;font-size:.95rem;margin-bottom:8px;padding:0;display:flex;gap:8px;align-items:center}
legend small{font-weight:500;color:var(--muted);font-size:.8rem}
.btn{font:inherit;font-weight:800;cursor:pointer;border-radius:8px;border:2px solid var(--ink);background:var(--surface);color:var(--ink);padding:9px 16px;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{border:2px dashed var(--line)}
.btn.sm{padding:5px 11px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{padding:14px 20px;font-size:1.05rem;width:100%}
.mesas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mesa{position:relative;cursor:pointer}
.mesa input{position:absolute;opacity:0;inset:0}
.mesa span{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px dashed var(--line);border-radius:10px;padding:8px 4px;font-weight:700;font-size:.78rem;background:#fff}
.mesa span b{font-size:1.5rem;font-weight:800;line-height:1}
.mesa input:checked+span{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.mesa input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}

/* selector de tarjetas */
.cardtag{display:inline-flex;align-items:center;justify-content:center;min-width:2.2em;font-size:.7rem;font-weight:800;border-radius:4px;padding:2px 6px;color:#fff;background:var(--cc,var(--chip))}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.pick{position:relative;cursor:pointer;display:block}
.pick input{position:absolute;opacity:0;inset:0}
.pick span{display:flex;flex-direction:column;height:100%;border-radius:8px;background:var(--cc);padding:5px;gap:5px;transition:transform .12s}
.pick span .cardtag{align-self:flex-start;background:transparent;color:#fff;font-size:.8rem;padding:2px 3px;min-width:0}
.pick span em{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-style:normal;background:#fff;border-radius:3px;padding:7px 6px;font-size:.84rem;font-weight:700;line-height:1.2;color:var(--label);outline:1px dashed color-mix(in srgb,var(--cc) 70%,#000);outline-offset:-3px}
.pick:hover span{transform:translateY(-1px)}
.pick input:checked+span{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.pick input:checked+span em{background:var(--ink);color:#fff;outline-color:transparent}
.pick input:focus-visible+span{outline:3px solid var(--ink);outline-offset:3px}
.cardblock{border:1.5px dashed var(--cc);background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cardblock .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.cardblock .hd b{font-weight:800;color:#fff;background:var(--cc);border-radius:6px;padding:3px 10px;font-size:1rem}
.cardblock .hd small{color:var(--muted);font-weight:500}
.subcat{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:color-mix(in srgb,var(--cc) 70%,#1D1A17);margin-top:4px}
.preview{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:3;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:.92rem;font-weight:500;display:flex;flex-direction:column;gap:8px}
.preview b{color:#fff}
.preview .row{justify-content:space-between}

/* zonas */
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px}
.zone{display:flex;flex-direction:column;gap:2px;border:2px dashed var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.84rem;font-weight:500;background:#fff;position:relative}
.zone input{position:absolute;opacity:0;inset:0}
.zone b{display:flex;gap:6px;align-items:center;font-size:.92rem}
.zone:has(input:checked){border-style:solid;border-color:var(--zc);background:color-mix(in srgb,var(--zc) 16%,#fff)}
.zone:has(input:focus-visible){outline:3px solid var(--zc);outline-offset:2px}
@media (max-width:480px){.zones{grid-template-columns:1fr}}
.sw{width:14px;height:14px;border-radius:50%;flex:none;display:inline-block}
.zchip{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.zchip .sw{width:9px;height:9px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.legend .it{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:#fff;border:2px solid var(--zc)}
.legend .it .sw{width:22px;height:22px;margin-top:2px}

/* tarjetas de contenido */
.card{background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:9px;min-width:0}
.card .hd{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card .sub{font-weight:800;font-size:1rem;line-height:1.25}
.card .txt{font-size:.9rem;font-weight:500;overflow-wrap:anywhere}
.card .ft{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:auto}
.card.mine{border-style:solid;border-color:var(--accent);background:#fff}
.mesatag{font-size:.72rem;font-weight:700;color:var(--muted)}
.relato{font-size:.9rem;font-weight:500;line-height:1.4}
.relato .k{font-weight:800}
.relato .k.s{color:var(--soy)} .relato .k.q{color:var(--quiero)} .relato .k.j{color:var(--justo)} .relato .k.o{color:var(--obst)}
.catchip{font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:2px 6px;color:#fff;white-space:nowrap}
.catchip.U{background:var(--uso)} .catchip.T{background:var(--tra)}

/* votos */
.votebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:4;background:var(--accent);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between;margin-top:16px}
.dots{display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid #fff;display:inline-block}
.dots i.on{background:#fff}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:#fff;color:var(--accent);font:inherit;font-size:1.3rem;font-weight:800;cursor:pointer;line-height:1}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .n{font-size:1.25rem;font-weight:800;min-width:1.6em;text-align:center}

/* votación en vivo */
.live{position:relative}
.lrow{position:absolute;left:0;right:0;height:58px;display:grid;grid-template-columns:2.4em minmax(0,1fr) 8em;gap:10px;align-items:center;transition:top .6s cubic-bezier(.2,.8,.2,1)}
.lrow .pos{font-size:1.5rem;font-weight:800;color:var(--muted);text-align:center}
.lrow.top3 .pos{color:var(--accent-ink)}
.lrow .nm{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.lrow .bar{height:12px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:6px}
.lrow .bar b{display:block;height:100%;background:var(--muted);border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.lrow.top3 .bar b{background:var(--accent)}
.lrow .sc{text-align:right;font-variant-numeric:tabular-nums}
.lrow .sc b{font-size:1.3rem;font-weight:800;display:block;line-height:1}
.lrow .sc span{font-size:.72rem;color:var(--muted);font-weight:700;white-space:nowrap}

/* podio y ponderación */
.podio{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}
@media (max-width:760px){.podio{grid-template-columns:1fr}}
.pcard{border-radius:10px;padding:14px 16px;background:var(--dc);color:#fff;display:flex;flex-direction:column;gap:6px;min-width:0;border:1.5px dashed rgba(0,0,0,.35);transition:transform .3s}
.pcard .badge{align-self:flex-start;background:#fff;color:#1E1E1E;font-weight:800;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pcard h3{color:#fff;font-size:1.12rem;line-height:1.2}
.pcard:first-child h3{font-size:1.45rem}
.pcard .big{font-size:2.3rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.pcard .calc{font-size:.84rem;font-weight:700;background:rgba(255,255,255,.22);border-radius:6px;padding:3px 8px;align-self:flex-start}
.pcard.vacio{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.pcard.vacio h3{color:var(--muted)}
.pcard.flash{transform:scale(1.03)}
.pesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.peso{border-radius:10px;border:1.5px dashed var(--pc);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.peso .x{font-size:2rem;font-weight:900;color:var(--pc);line-height:1}
.peso .trk{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.peso .trk b{display:block;height:100%;background:var(--pc);border-radius:99px;transition:width .6s}
.lrow .tag{font-size:.62rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;color:#fff;background:var(--dc,#1E1E1E);flex:none}
.lrow.elegido{background:color-mix(in srgb,var(--dc) 12%,transparent);border-radius:8px}
.lrow.elegido .bar b{background:var(--dc)!important}
.lrow.flash .sc b{animation:flash .9s}
@keyframes flash{0%{color:var(--e12);transform:scale(1.35)}100%{transform:none}}
.mini{display:flex;flex-direction:column;gap:8px}
.mini .it{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.86rem;font-weight:700}
.mini .it .trk{grid-column:2/4;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:-4px}
.mini .it .trk b{display:block;height:100%;background:var(--e12);border-radius:99px}
.wchip{display:inline-flex;gap:6px;align-items:center;font-size:.72rem;font-weight:800;border-radius:999px;padding:3px 10px;color:#fff;background:var(--wc)}

/* ficha municipal de proyecto (Figma: Instrucciones) */
.ficha{background:#F1F0EC;border:1.5px solid #8A8784;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.fh{background:#E6E4DF;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fh h2{font-size:1.2rem;letter-spacing:.01em;color:#333}
.fh .sub{font-size:.8rem;color:#555;font-weight:500}
.fh .campos{display:grid;grid-template-columns:minmax(0,2fr) auto minmax(0,1.5fr);gap:8px 12px;align-items:end}
.fh .campos label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;font-weight:700;color:#555}
.fh .campos input{padding:7px 10px}
.fh .mesaN{font-size:1.4rem;font-weight:900;color:#333;padding:2px 10px;border-bottom:1.5px solid #8A8784}
.fgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr) minmax(0,.9fr);gap:12px}
.fgrid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.fgrid,.fgrid2{grid-template-columns:1fr}.fh .campos{grid-template-columns:1fr}}

/* ============ CÁLCULOS ============ */
function calcProblemas(){
  const P=S.data.problemas,N=P.length;
  const cnt={U:0,T:0};P.forEach(p=>cnt[obstCat(p)]=(cnt[obstCat(p)]||0)+1);
  const peso={};OBST.forEach(c=>peso[c.id]=N?cnt[c.id]/N*OBST.length:0);
  const votos={};let totalVotos=0;
  S.data.votos.forEach(v=>Object.entries(v.asignacion||{}).forEach(([k,n])=>{votos[k]=(votos[k]||0)+(+n||0);totalVotos+=(+n||0)}));
  const G={};
  P.forEach(p=>{const k=obstKey(p);const g=G[k]||(G[k]={key:k,cat:obstCat(p),nombre:obstTxt(p),accion:esOtroObst(p)?'resolver '+low(p.obstOtro||'el problema detectado'):(OBM[p.obst]||{}).a,relatos:[],zonas:new Set(),mesas:new Set(),code:esOtroObst(p)?'':p.obst});g.relatos.push(p);(p.zonas||[]).forEach(z=>g.zonas.add(z));g.mesas.add(+p.mesa)});
  const lista=Object.values(G).map(g=>{
    const zonas=ZONAS.map(z=>z.id).filter(z=>g.zonas.has(z));
    const tf=S.estado.transversalidad?1+TRANSV*Math.max(0,zonas.length-1):1;
    const v=votos[g.key]||0;
    return {...g,zonas,mesas:[...g.mesas].sort(),votos:v,peso:peso[g.cat]||0,tf,puntaje:v*(peso[g.cat]||0)*tf}
  }).sort((a,b)=>b.puntaje-a.puntaje||b.votos-a.votos||b.relatos.length-a.relatos.length||a.nombre.localeCompare(b.nombre));
  const votantes=S.data.votos.filter(v=>Object.values(v.asignacion||{}).some(n=>n>0)).length;
  return {N,cnt,peso,lista,totalVotos,votantes}
}
function plantillaDesafio(g){
  const soyP=moda(g.relatos.map(p=>p.soy==='otro'?'otro:'+p.soyOtro:p.soy));
  const quiP=moda(g.relatos.map(p=>p.quiero==='otro'?'otro:'+p.quieroOtro:p.quiero));
  const fake={soy:soyP&&soyP.startsWith('otro:')?'otro':soyP,soyOtro:soyP&&soyP.startsWith('otro:')?soyP.slice(5):'',quiero:quiP&&quiP.startsWith('otro:')?'otro':quiP,quieroOtro:quiP&&quiP.startsWith('otro:')?quiP.slice(5):''};
  return `¿Cómo podríamos ${g.accion}, para que ${soyFrase(fake)} pueda ${quieroFrase(fake)} en ${zonasTexto(g.zonas)}, sin detener la actividad del delivery en el barrio?`
}
function desafioDeMesa(m,sol){
  const D=S.estado.desafios||[];if(!D.length)return null;
  const a=S.estado.asignacion||'uno';
  if(a==='uno')return 0;
  if(a==='asignado')return (m-1)%D.length;
  return sol&&Number.isInteger(sol.desafio)?sol.desafio:null;
}
const tokensDe=s=>(s.compras||[]).reduce((a,id)=>a+((ING[id]||{}).p||0),0);
const catsCubiertas=s=>MENU.filter(c=>(s.compras||[]).some(id=>(ING[id]||{}).cat===c.id)).map(c=>c.id);
function calcRanking(){
  const evs=S.data.evaluaciones;
  return S.data.soluciones.filter(s=>(s.compras||[]).length||s.texto).map(s=>{
    const notas=evs.map(e=>(e.notas||{})[s.id]).filter(n=>n&&CRITERIOS.every(([k])=>n[k]));
    const k=notas.length,avg=f=>k?notas.reduce((a,n)=>a+n[f],0)/k:NaN;
    const r={...s,k,tokens:tokensDe(s)};CRITERIOS.forEach(([c])=>r[c]=avg(c));
    r.puntaje=k?CRITERIOS.reduce((a,[c])=>a+r[c],0)/CRITERIOS.length:NaN;return r
  }).sort((a,b)=>(Number.isFinite(b.puntaje)?b.puntaje:-1)-(Number.isFinite(a.puntaje)?a.puntaje:-1)||a.mesa-b.mesa)
}

function baseURL(){return (S.estado.url||ARTIFACT_URL||(location.protocol.startsWith('http')?location.origin+location.pathname:'')).replace(/#.*$/,'')}
function qrSVG(text){
  if(typeof qrcode!=='function'||!text)return '';
  const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),m=2;let d='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2*m} ${n+2*m}" shape-rendering="crispEdges" role="img" aria-label="Código QR"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`
}

function tiempoRestante(){
  if(!hayJornada()||!S.estado.faseInicio)return null;
  return S.estado.faseInicio+(dur(S.estado.fase)+(+S.estado.extra||0))*60000-Date.now();
}
function fmtT(ms){const s=Math.round(Math.abs(ms)/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function pintarTrack(){
  const tr=$('#track'),info=$('#trackinfo');
  if(!hayJornada()){tr.innerHTML='';info.innerHTML='<span class="muted">Sin jornada activa</span>';return}
  const idx=FASES.findIndex(f=>f.id===S.estado.fase);
  const rest=tiempoRestante(),total=(dur(S.estado.fase)+(+S.estado.extra||0))*60000;
  const pct=rest==null?0:Math.max(0,Math.min(100,(1-rest/total)*100));
  tr.innerHTML=FASES.map((f,i)=>`<div class="seg ${i<idx?'done':i===idx?'now':''}" data-sc="${f.e}" style="--sc:var(--e${f.e})" title="${f.n} ${esc(f.t)} · ${dur(f.id)} min"><b>${f.n}</b><span>${f.c}</span>${i===idx?`<i class="fill" style="width:${pct}%"></i>`:''}</div>`).join('');
  const f=FASES[idx]||FASES[0];const ses=sesionActual();
  info.innerHTML=`<span>Etapa ${f.n} · ${esc(f.t)}</span><span>${rest==null?'':rest>=0?`<span class="timer">${fmtT(rest)}</span> restantes de ${dur(f.id)+(+S.estado.extra||0)} min`:`<span class="timer over">+${fmtT(rest)}</span> sobre el tiempo`}${ses&&ses.nombre?` · <span class="muted">${esc(ses.nombre)}</span>`:''}</span>`;
}

function statFase(f){
  const C=calcProblemas();
  return ({inicio:'Comenzamos el recorrido',registro:`${C.N} relatos registrados en ${new Set(S.data.problemas.map(p=>p.mesa)).size} mesas`,votacion:`${C.totalVotos} votos de ${C.votantes} vecinos`,desafios:`${(S.estado.desafios||[]).length} desafíos definidos`,mercado:`${S.data.soluciones.filter(s=>s.estado==='lista').length} proyectos entregados`,evaluacion:`${S.data.evaluaciones.filter(e=>Object.keys(e.notas||{}).length).length} vecinos evaluaron`,cierre:'Taller terminado'})[f]||''
}
function mostrarCierre(de,a){
  const fd=FASEM[de],fa=FASEM[a];if(!fd||!fa)return;
  const iDe=FASES.indexOf(fd),iA=FASES.indexOf(fa);
  const ov=$('#overlay');
  const titulo=iA>iDe?`Cerramos la etapa ${fd.n}`:`Volvemos a la etapa ${fa.n}`;
  ov.innerHTML=`<div class="box" style="--oc:var(--e${iA>iDe?fd.e:fa.e})" role="dialog" aria-live="polite"><div class="chk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
   <span class="etapa" style="color:var(--oc)">${iA>iDe?esc(fd.t):''}</span><h2>${titulo}</h2>${iA>iDe?`<p class="muted" style="font-weight:600">${esc(statFase(de))}</p>`:''}
   <p class="next" style="color:var(--e${fa.e})">Ahora: Etapa ${fa.n} · ${esc(fa.t)} · ${dur(fa.id)} min</p><button class="btn sm ghost" id="ov-ok" style="align-self:center">Continuar</button></div>`;
  ov.hidden=false;$('#ov-ok').onclick=()=>ov.hidden=true;clearTimeout(mostrarCierre._t);mostrarCierre._t=setTimeout(()=>ov.hidden=true,6000);
}

function avisoAcceso(){
  if(S.modo==='local')return `<div class="notice">Modo local: los datos se guardan solo en este dispositivo. Para compartir entre mesas y celulares, completa FIREBASE_CONFIG en el archivo.</div>`;
  if(S.modo==='error')return `<div class="notice">No se pudo conectar con la base de datos. Revisa la conexión a internet y la configuración.</div>`;
  return ''
}
function sinJornada(){return `<div class="empty"><h3>No hay una jornada activa</h3><p>El equipo facilitador debe iniciar la jornada desde Inicio. Esta pantalla se actualiza sola.</p></div>`}
function esperaFase(fase,txt){const f=FASEM[fase];return `<div class="empty"><h3>Esta etapa aún no está abierta</h3><p>${txt}</p><p class="small" style="margin-top:8px">Ahora: Etapa ${(FASEM[S.estado.fase]||{}).n} · ${esc((FASEM[S.estado.fase]||{}).t)}. Se abrirá en la etapa ${f.n} · ${esc(f.t)}.</p></div>`}
function guiaHTML(fase,abierta){
  const g=GUIA[fase],f=FASEM[fase];if(!g)return '';
  return `<details class="guia" ${abierta?'open':''}><summary>¿Qué hago en la etapa ${f.n}? · ${esc(f.t)}</summary><div class="guiabody">
   <div><h4>Objetivo</h4><p>${esc(g.obj)}</p></div>
   <div><h4>Materiales</h4><ul>${g.mat.map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>
   <div><h4>Paso a paso · ${dur(fase)} min</h4><ol>${g.pasos.map(m=>`<li>${esc(m)}</li>`).join('')}</ol></div>
   <p class="clave">${esc(g.clave)}</p></div></details>`
}
function mesaRadios(name,sel){return `<div class="mesas" role="radiogroup">${Array.from({length:MESAS},(_,i)=>i+1).map(i=>`<label class="mesa"><input type="radio" name="${name}" value="${i}" ${+sel===i?'checked':''}><span><b>${i}</b>Mesa</span></label>`).join('')}</div>`}
const mesaSel=(el,name)=>{const r=el.querySelector(`input[name=${name}]:checked`);return r?+r.value:null};

  return `<div class="picker">${items.map(([id,n])=>`<label class="pick" style="--cc:var(${cc})"><input type="radio" name="${name}" value="${id}"><span><i class="cardtag">${id}</i><em>${esc(n)}</em></span></label>`).join('')}${conOtro?`<label class="pick" style="--cc:var(${cc})"><input type="radio" name="${name}" value="${conOtro}"><span><i class="cardtag">+</i><em>Otra</em></span></label>`:''}</div>`
}
VISTAS.registro={
 mount(el){
  el.innerHTML=`<div class="grid g2" style="align-items:start">
   <form class="stack" id="fr" novalidate>

     <p class="small muted">Toca las tarjetas que eligió el vecino, en el mismo orden en que las relata. El número de cada opción es el de la tarjeta física.</p></div>

    ${guiaHTML('registro',false)}

    <label class="f">Ubicación aproximada <small>Opcional. Ej. Manuel Montt con Providencia.</small><input type="text" id="r-ubic" maxlength="100"></label>

   </form>
   <section class="stack"><div class="row" style="justify-content:space-between"><h2 id="r-h">Relatos de la mesa</h2><span class="small muted" id="r-tot"></span></div><div class="stack" id="r-list"></div></section>
  </div>`;
  const pares=[['r-soy','r-soyO',v=>v==='otro'],['r-qui','r-quiO',v=>v==='otro'],['r-jus','r-jusO',v=>v==='otro'],['r-obs','r-obsO',v=>/0$/.test(v)]];
  const upd=()=>{pares.forEach(([n,o,f])=>{const v=(el.querySelector(`input[name=${n}]:checked`)||{}).value;$('#'+o).hidden=!(v&&f(v))});const p=leerRelato(el);$('#r-prev').innerHTML=p.soy&&p.quiero&&p.obst?fraseRelato(p)+(p.zonas.length?' '+zchips(p.zonas):''):'Elige Soy, Quiero y Me encontré con para armar el relato.'};
  const fr=$('#fr');
  fr.addEventListener('change',e=>{if(e.target.name==='r-mesa'){LS.set('bd.mesa',+e.target.value);this.refresh()}upd()});
  fr.addEventListener('input',e=>{if(e.target.id&&e.target.id.endsWith('O'))upd()});
  formRel.upd=upd;
  $('#r-clear').onclick=()=>{limpiarRelato(el);upd()};
  $('#fr').onsubmit=async e=>{
   e.preventDefault();const err=$('#r-err');const p=leerRelato(el);
   const falta=[];if(!p.mesa)falta.push('mesa');if(!p.soy)falta.push('Soy');if(p.soy==='otro'&&!p.soyOtro)falta.push('texto de Soy');if(!p.quiero)falta.push('Quiero');if(p.quiero==='otro'&&!p.quieroOtro)falta.push('texto de Quiero');if(!p.obst)falta.push('Me encontré con');if(p.obst&&/0$/.test(p.obst)&&!p.obstOtro)falta.push('nombre del problema nuevo');if(!p.zonas.length)falta.push('zona');
   if(falta.length){err.textContent='Falta: '+falta.join(', ')+'.';err.hidden=false;return}

   if(ok){limpiarRelato(el);upd();window.scrollTo({top:0,behavior:'smooth'})}
  };
 },
 refresh(){
  $('#aviso').innerHTML=hayJornada()?avisoAcceso():sinJornada();
  const mesa=mesaSel(document,'r-mesa');

  $('#r-h').textContent=mesa?'Relatos de la mesa '+mesa:'Relatos de la mesa';
  $('#r-tot').textContent=`${S.data.problemas.length} en total`;
  $('#r-list').innerHTML=!mesa?'<div class="empty">Elige tu mesa para ver aquí sus relatos.</div>':L.length?L.map(p=>`<article class="card"><div class="hd"><span class="catchip ${obstCat(p)}">${esc(CATM[obstCat(p)].n)}</span>${p.ejemplo?'<span class="ex">Ejemplo</span>':''}<span class="mesatag">${esc(p.ubic||'')}</span></div>${fraseRelato(p)}${p.texto?`<p class="small muted">${esc(p.texto)}</p>`:''}<div class="ft">${zchips(p.zonas)}<span style="flex:1"></span><button class="btn sm" data-dup="${p.id}">Duplicar</button><button class="btn sm ghost" data-del="${p.id}">Eliminar</button></div></article>`).join(''):'<div class="empty">Aún no hay relatos de esta mesa. El primero aparecerá aquí apenas lo registres.</div>';
  $('#r-list').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>guardar(()=>del('problemas',b.dataset.del),'Relato eliminado'));
  $('#r-list').querySelectorAll('[data-dup]').forEach(b=>b.onclick=()=>{const p=S.data.problemas.find(x=>x.id===b.dataset.dup);if(p){cargarRelato(document,p);formRel.upd&&formRel.upd();window.scrollTo({top:0,behavior:'smooth'});toast('Relato copiado al formulario: cambia lo distinto y registra')}});
 }
};
function leerRelato(el){
  const v=n=>(el.querySelector(`input[name=${n}]:checked`)||{}).value||'';
  const obst=v('r-obs');
  return {mesa:mesaSel(el,'r-mesa'),soy:v('r-soy'),soyOtro:$('#r-soyO').value.trim(),quiero:v('r-qui'),quieroOtro:$('#r-quiO').value.trim(),justo:v('r-jus'),justoOtro:$('#r-jusO').value.trim(),obst,obstOtro:$('#r-obsO').value.trim(),zonas:[...el.querySelectorAll('input[name=r-z]:checked')].map(x=>x.value),ubic:$('#r-ubic').value.trim(),texto:$('#r-texto').value.trim()}
}
function limpiarRelato(el){el.querySelectorAll('input[name=r-soy],input[name=r-qui],input[name=r-jus],input[name=r-obs],input[name=r-z]').forEach(x=>x.checked=false);['r-soyO','r-quiO','r-jusO','r-obsO','r-ubic','r-texto'].forEach(i=>$('#'+i).value='')}
function cargarRelato(el,p){
  limpiarRelato(el);
  const set=(n,v)=>{const i=el.querySelector(`input[name=${n}][value="${v}"]`);if(i)i.checked=true};
  set('r-mesa',p.mesa);set('r-soy',p.soy);set('r-qui',p.quiero);set('r-jus',p.justo);set('r-obs',p.obst);(p.zonas||[]).forEach(z=>set('r-z',z));
  $('#r-soyO').value=p.soyOtro||'';$('#r-quiO').value=p.quieroOtro||'';$('#r-jusO').value=p.justoOtro||'';$('#r-obsO').value=p.obstOtro||'';$('#r-ubic').value=p.ubic||'';
}

/* ---------- 1.2 VOTAR ---------- */
let borradorVoto=null;
const guardarVoto=debounce(async()=>{if(!borradorVoto)return;await guardar(()=>put('votos',voterId(),{asignacion:borradorVoto,ts:Date.now()}))},600);
VISTAS.votar={
 mount(el){
  el.innerHTML=`<div class="narrow stack"><div class="stack" style="gap:6px"><span class="etapa">Etapa 1.2 · Votación digital</span><h1>¿Qué problema es más urgente?</h1>
   <p class="muted" style="font-weight:500">Estos son los problemas que levantaron las ${MESAS} mesas. Tienes <b>${VOTOS_MAX} votos</b>: dalos a distintos problemas o varios a uno. Cada voto se multiplica por el peso de su tipo de problema.</p></div>
   <div id="aviso"></div><div id="v-live"></div><div id="v-body" class="stack"></div></div>`;
 },
 refresh(){
  const body=$('#v-body'),live=$('#v-live');
  if(!hayJornada()){$('#aviso').innerHTML='';live.innerHTML='';body.innerHTML=sinJornada();borradorVoto=null;return}
  $('#aviso').innerHTML=avisoAcceso();
  const C=calcProblemas();
  live.innerHTML=C.lista.length&&(S.estado.fase==='votacion'||(S.estado.desafios||[]).length)?miniRanking(C):'';
  if(S.estado.fase!=='votacion'){body.innerHTML=(S.estado.fase==='desafios'||FASES.findIndex(f=>f.id===S.estado.fase)>3?`<div class="empty"><h3>La votación terminó</h3><p>Arriba están los problemas elegidos. En el <a href="#buzon">Buzón de desafíos</a> pueden convertirlos en desafíos.</p></div>`:esperaFase('votacion','El equipo facilitador la abrirá al terminar el registro de relatos. Esta pantalla se actualiza sola.'))+botonSiguiente();bindSig();return}
  const id=voterId();
  if(!borradorVoto){const mio=S.data.votos.find(v=>v.id===id);borradorVoto={...((mio&&mio.asignacion)||{})}}
  const usados=Object.values(borradorVoto).reduce((a,b)=>a+b,0),libres=VOTOS_MAX-usados;
  if(!C.lista.length){body.innerHTML='<div class="empty">Todavía no hay problemas registrados.</div>';return}
  let html='';
  OBST.forEach(c=>{
   const gs=C.lista.filter(g=>g.cat===c.id).sort((a,b)=>b.relatos.length-a.relatos.length);if(!gs.length)return;
   html+=`<div class="stack" style="gap:4px;margin-top:6px"><div class="row" style="justify-content:space-between"><h3>${esc(c.n)}</h3><span class="wchip" style="--wc:var(${c.c})">Peso ×${fmt(C.peso[c.id])}</span></div><p class="small muted">${C.cnt[c.id]} de ${C.N} relatos son de este tipo, por eso cada voto aquí suma ${fmt(C.peso[c.id])} puntos.</p></div>`;
   gs.forEach(g=>{const n=borradorVoto[g.key]||0;
    html+=`<article class="card ${n?'mine':''}"><div class="hd"><span class="sub">${g.code?`<i class="cardtag" style="--cc:var(${c.c})">${g.code}</i> `:''}${esc(g.nombre)}</span></div>
     <p class="small muted" style="font-weight:600">${g.relatos.length} relato${g.relatos.length>1?'s':''} · mesa${g.mesas.length>1?'s':''} ${g.mesas.join(', ')}</p>
     <details class="small"><summary style="cursor:pointer;font-weight:600">Ver relatos</summary><div class="stack" style="gap:6px;margin-top:6px">${g.relatos.slice(0,6).map(fraseRelato).join('')}</div></details>
     <div class="ft">${zchips(g.zonas)}<div class="stepper" style="margin-left:auto"><button type="button" data-m="${esc(g.key)}" ${n?'':'disabled'} aria-label="Quitar voto">−</button><span class="n">${n}</span><button type="button" data-p="${esc(g.key)}" ${libres?'':'disabled'} aria-label="Dar voto">+</button></div></div></article>`});
  });
  html+=`<div class="votebar"><div><b>${libres?`Te quedan ${libres} voto${libres>1?'s':''}`:'Votos completos. ¡Gracias!'}</b><div class="small" style="opacity:.9">Arriba y en la pantalla ves cómo va en vivo</div></div><div class="dots">${Array.from({length:VOTOS_MAX},(_,i)=>`<i class="${i<usados?'on':''}"></i>`).join('')}</div></div>${botonSiguiente()}`;
  const opens=[...body.querySelectorAll('details[open]')].map(d=>{const a=d.closest('article');const b=a&&a.querySelector('[data-p]');return b?b.dataset.p:null});
  body.innerHTML=html;
  body.querySelectorAll('[data-p]').forEach(b=>{if(opens.includes(b.dataset.p)){const d=b.closest('article').querySelector('details');if(d)d.open=true}});
  body.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(usados<VOTOS_MAX){borradorVoto[b.dataset.p]=(borradorVoto[b.dataset.p]||0)+1;guardarVoto();this.refresh()}});
  body.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;borradorVoto[k]=Math.max(0,(borradorVoto[k]||0)-1);if(!borradorVoto[k])delete borradorVoto[k];guardarVoto();this.refresh()});
  bindSig();
 }
};
function elegidoN(key){const i=(S.estado.desafios||[]).findIndex(d=>d.key===key);return i<0?0:i+1}
function miniRanking(C){
  const fijos=(S.estado.desafios||[]).length>0;const top=C.lista.slice(0,5);const max=Math.max(...top.map(g=>g.puntaje),0.0001);
  return `<section class="panel stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h3>${fijos?'Problemas elegidos':'Así va la votación'}</h3><span class="small muted">${C.totalVotos} votos · ${C.votantes} vecinos</span></div>
   <div class="mini">${top.map((g,i)=>{const e=elegidoN(g.key);return `<div class="it"><span class="num">${i+1}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.nombre)}${e?` <span class="wchip" style="--wc:var(--d${e})">Elegido N°${e}</span>`:''}</span><span class="num">${fmt(g.puntaje,1)}</span><span class="trk"><b style="width:${g.puntaje/max*100}%;${e?`background:var(--d${e})`:''}"></b></span></div>`}).join('')}</div></section>`
}
function botonSiguiente(){return `<details class="small muted" style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">¿Votan varios vecinos en esta tablet?</summary><p style="margin:8px 0">Cuando un vecino termine, toca el botón para que el siguiente vote por su cuenta.</p><button class="btn sm" id="sig">Siguiente vecino</button></details>`}
function bindSig(){const b=$('#sig');if(b)b.onclick=siguienteVecino}

/* ---------- 1.2 BUZÓN DE DESAFÍOS ---------- */
let buzSel=null,buzManual=false;
const BENEF={U:'que el espacio público sea cómodo para todos',T:'que la calle sea más segura para todos'};
function problemaBase(key){const C=calcProblemas();return C.lista.find(g=>g.key===key)||null}
function personaDe(g){const soyP=moda(g.relatos.map(p=>p.soy).filter(x=>x&&x!=='otro'))||'S12';const quiP=moda(g.relatos.map(p=>p.quiero).filter(x=>x&&x!=='otro'))||'Q1';const jusP=moda(g.relatos.map(p=>p.justo).filter(x=>x&&x!=='otro'))||'';return {soy:soyP,quiero:quiP,justo:jusP}}
function ejemplosDesafio(g){
  const pp=personaDe(g);const soy=(SOYM[pp.soy]||{}).f||'una persona del barrio',qui=(QUIM[pp.quiero]||{}).f||'moverse por el barrio';const z=zonasTexto(g.zonas);const pr=low(g.nombre);
  return [
   ['Centrada en las personas',`¿Cómo podríamos ${g.accion}, para que ${soy} pueda ${qui} en ${z}, sin detener la actividad del delivery en el barrio?`],
   ['Centrada en la convivencia',`¿Cómo podríamos lograr que vecinos, repartidores y comercios compartan ${z} sin que haya ${pr}?`],
   ['Centrada en la oportunidad',`¿Cómo podríamos transformar ${pr} en una oportunidad para ${BENEF[g.cat]||'mejorar el barrio'}?`],
   ['Centrada en un momento',`¿Cómo podríamos ${g.accion} incluso cuando ${low((JUSM[pp.justo]||{n:'es horario punta'}).n)}, para que ${soy} pueda ${qui}?`]];
}
function redactar(f){
  const soy=f.soy==='otro'?(f.soyO||'una persona del barrio'):(SOYM[f.soy]||{}).f||'una persona del barrio';
  const qui=f.quiero==='otro'?(f.quiO||'moverse por el barrio'):(QUIM[f.quiero]||{}).f||'moverse por el barrio';
  const cuando=f.justo?` incluso cuando ${low((JUSM[f.justo]||{}).n||'')}`:'';
  return `¿Cómo podríamos ${f.accion||'…'}${cuando}, para que ${soy} pueda ${qui} en ${zonasTexto(f.zonas||[])}, ${f.cierre||'sin detener la actividad del delivery en el barrio'}?`
}
VISTAS.buzon={
 mount(el){
  el.innerHTML=`<div class="stack" style="max-width:900px;margin:0 auto;gap:22px">
   <div class="buzhead"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="18" width="52" height="38" rx="5" fill="#8A54B3"/><path d="M6 23l26 17 26-17" fill="none" stroke="#fff" stroke-width="3.5" stroke-linejoin="round"/><rect x="18" y="6" width="28" height="20" rx="2" fill="#fff" stroke="#0E74B5" stroke-width="2" stroke-dasharray="4 3"/><path d="M24 13h16M24 19h10" stroke="#8A54B3" stroke-width="2.5" stroke-linecap="round"/></svg>
    <div class="stack" style="gap:4px"><span class="etapa">Etapa 1.2 · Buzón de desafíos</span><h1>De problema a desafío</h1><p class="muted" style="font-weight:500">Elige un problema, mira cómo se puede redactar, escribe tu versión y échala al buzón. El equipo facilitador elige la mejor redacción para cada desafío.</p></div></div>
   <div id="aviso"></div>
   <section class="stack" style="gap:8px"><h3>1 · Elige el problema</h3><div class="probs" id="b-probs"></div></section>
   <section class="stack" style="gap:8px"><h3>2 · Ejemplos de redacción</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px" id="b-ej"></div>
    <details class="guia"><summary>Así sí, así no</summary><div class="guiabody"><div class="sino">
     <div class="no"><b>Muy amplio</b>¿Cómo mejoramos el delivery?</div><div class="si"><b>Acotado</b>Nombra a quién afecta, qué necesita y dónde ocurre.</div>
     <div class="no"><b>Culpa a alguien</b>¿Cómo obligamos a los repartidores a no subirse a la vereda?</div><div class="si"><b>Busca convivencia</b>¿Cómo podríamos sacar de la vereda la circulación de motos, para que una persona mayor camine segura?</div>
     <div class="no"><b>Trae la solución escondida</b>¿Cómo ponemos más multas en Manuel Montt?</div><div class="si"><b>Deja espacio para idear</b>¿Cómo podríamos mantener libres los accesos en zonas comerciales?</div></div></div></details></section>
   <section class="stack" style="gap:10px"><h3>3 · Redacta y echa al buzón</h3><div class="builder" id="b-builder"></div></section>
   <section class="stack" style="gap:8px"><div class="row" style="justify-content:space-between"><h3>Buzón</h3><span class="small muted" id="b-n"></span></div><div class="stack" id="b-list" style="gap:8px"></div></section>
  </div>`;
 },
 refresh(){
  const av=$('#aviso');
  if(!hayJornada()){av.innerHTML=sinJornada();['b-probs','b-ej','b-builder','b-list'].forEach(i=>$('#'+i).innerHTML='');return}
  av.innerHTML=avisoAcceso()+(FASES.findIndex(f=>f.id===S.estado.fase)<3?'<div class="notice info">Los problemas elegidos se definen al cerrar la votación. Mientras, puedes practicar con cualquier problema.</div>':'');
  const C=calcProblemas();const D=S.estado.desafios||[];
  const orden=D.length?[...D.map(d=>C.lista.find(g=>g.key===d.key)).filter(Boolean),...C.lista.filter(g=>!D.some(d=>d.key===g.key))]:C.lista;
  if(!orden.length){$('#b-probs').innerHTML='<div class="empty">Aún no hay problemas registrados.</div>';$('#b-ej').innerHTML='';$('#b-builder').innerHTML='';pintarBuzon();return}
  if(!buzSel||!orden.some(g=>g.key===buzSel))buzSel=orden[0].key;
  $('#b-probs').innerHTML=orden.slice(0,D.length?Math.max(3,6):6).map(g=>{const e=elegidoN(g.key);const c=CATM[g.cat]||{};return `<label class="pick" style="--cc:var(${e?'--d'+e:c.c})"><input type="radio" name="b-p" value="${esc(g.key)}" ${g.key===buzSel?'checked':''}><span><i class="cardtag">${e?'Desafío N°'+e:esc(g.code||g.cat)}</i><em>${esc(g.nombre)}</em></span></label>`}).join('');
  $('#b-probs').querySelectorAll('input').forEach(r=>r.onchange=()=>{buzSel=r.value;buzManual=false;$('#b-builder').dataset.k='';this.refresh()});
  const g=orden.find(x=>x.key===buzSel);

  const D=S.estado.desafios||[];
  return `<section class="panel" style="padding-block:8px"><div class="rk h"><span>#</span><span>Proyecto</span>${CRITERIOS.map(([k,n])=>`<span class="num opt-col">${n.slice(0,6)}.</span>`).join('')}<span class="num">Puntaje</span></div>
   ${R.length?R.map((s,i)=>{const di=desafioDeMesa(+s.mesa,s);return `<div class="rk"><span class="pos">${Number.isFinite(s.puntaje)?i+1:'–'}</span><div style="min-width:0"><b>${esc(nombreProyecto(s))}</b><div class="small muted">Mesa ${esc(s.mesa)} · ${s.tokens} tokens · ${s.k} evaluaciones${di!=null&&D[di]?` · Desafío N°${di+1}`:''}</div><div class="row" style="gap:4px;margin-top:4px">${zchips(s.zonas)}</div></div>${CRITERIOS.map(([k])=>`<span class="num opt-col">${fmt(s[k],1)}</span>`).join('')}<span class="num score">${fmt(s.puntaje)}</span></div>`}).join(''):'<div class="empty" style="margin:12px 0">Aún no hay proyectos evaluados.</div>'}</section>`
}
function pCierre(body){
  const C=calcProblemas();const R=calcRanking();const g=R.find(s=>Number.isFinite(s.puntaje));
  const stats=[[C.N,'relatos'],[C.totalVotos,'votos'],[(S.estado.desafios||[]).length,'desafíos'],[S.data.soluciones.filter(s=>(s.compras||[]).length).length,'proyectos'],[S.data.evaluaciones.filter(e=>Object.keys(e.notas||{}).length).length,'evaluadores']];
  body.innerHTML=`<div class="hero">${cabecera('cierre','Llegamos al final del camino')}<img class="vecina" alt="" src="${VECINA}"></div>
   <section class="panel stack" style="border-color:var(--e3)"><div class="camino">${FASES.map(f=>`<div class="cs" style="--sc:var(--e${f.e})"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><b>${f.n}</b><span>${f.c}</span></div>`).join('')}</div>
    <div class="kpis">${stats.map(([n,t])=>`<div class="kpi" style="border-color:var(--e3)"><b style="color:var(--e3)">${n}</b><span>${t}</span></div>`).join('')}</div></section>
   ${g?`<div class="winner"><span class="etapa" style="color:var(--e3)">Proyecto mejor evaluado · ${fmt(g.puntaje)} pts</span><h2 style="font-size:1.8rem">${esc(nombreProyecto(g))}</h2><p class="small" style="font-weight:600">Mesa ${g.mesa} · ${g.tokens} tokens invertidos</p>${g.texto?`<p>${esc(g.texto)}</p>`:''}</div>`:''}
   <p class="lead" style="max-width:none">Los proyectos mejor posicionados se integrarán a la cartera técnica de proyectos y gestión de la Municipalidad de Providencia. Gracias por construir el barrio que quieren ver.</p>
   ${rankTabla(R)}`;
}

/* ============ ARRANQUE ============ */
window.addEventListener('hashchange',mount);
mount();
(async function init(){
  S.esAdmin=!!LS.get('bd.fac',false);
  let db=null;
  const cfg=FIREBASE_CONFIG&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId;
  if(cfg&&window.firebase){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore()}catch(e){console.warn(e);S.modo='error';refresh();return}}
  else if(window.claude&&claude.use){try{db=await claude.use('db')}catch(e){}}
  if(!db){if(cfg&&!window.firebase){S.modo='error'}else{S.modo='local'}loadLocal();refresh();return}
  S.db=db;S.modo='compartido';let ok=false,primero=true;
  const tm=setTimeout(()=>{if(!ok)toast('Sin respuesta del servidor todavía; revisa la conexión')},10000);
  db.doc('control/estado').onSnapshot(snap=>{
   if(!snap.metadata||!snap.metadata.fromCache){ok=true;clearTimeout(tm)}
   const prev=S.estado;S.estado=snap.exists?{...S.estado,...snap.data()}:{...S.estado,tid:''};
   if(!S.estado.duraciones)S.estado.duraciones={...DUR0};
   if(prev.tid!==S.estado.tid||S.subs.length===0){subscribeTaller();borradorVoto=null;borradorEval=null;solLocal=null}
   if(!primero&&prev.tid===S.estado.tid&&S.estado.tid&&prev.fase!==S.estado.fase)mostrarCierre(prev.fase,S.estado.fase);
   primero=false;refresh();
  },e=>{console.warn(e);S.modo='error';refresh()});
  db.collection('control/estado/sesiones').onSnapshot(snap=>{S.sesiones=snap.docs.map(d=>({id:d.id,...d.data()}));refresh()},e=>console.warn(e));
  refresh();
})();
</script>
